name: Live German language smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-german-language-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify German compound routing in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status_one=$(curl --silent --show-error --max-time 90               --output /tmp/compound-one.json --write-out "%{http_code}"               -X POST "https://elevator.help/api/ask"               -H "Content-Type: application/json"               --data '{"question":"Wie hoch muss das Kabinengeländer auf dem Kabinendach sein?"}') || status_one="000"

            status_two=$(curl --silent --show-error --max-time 90               --output /tmp/compound-two.json --write-out "%{http_code}"               -X POST "https://elevator.help/api/ask"               -H "Content-Type: application/json"               --data '{"question":"Wie groß darf der Abstand zwischen Aufzugskabinentürschwelle und Schachttürschwelle sein?"}') || status_two="000"

            if [ "$status_one" = "200" ] && [ "$status_two" = "200" ] && node -e '
              const fs=require("fs");
              const one=JSON.parse(fs.readFileSync("/tmp/compound-one.json","utf8"));
              const two=JSON.parse(fs.readFileSync("/tmp/compound-two.json","utf8"));
              const firstUnderstood=/^standards_/.test(String(one.mode||"")) && String(one.answer||"").length>20;
              const secondVerified=two.mode==="standards_verified"
                && /35\s*mm/i.test(String(two.answer||""))
                && String(two.answer||"").includes("5.3.4.1");
              if(!firstUnderstood||!secondVerified){
                console.error(JSON.stringify({one,two},null,2));
                process.exit(1);
              }
            '; then
              echo "PASS: production understands German elevator compounds."
              exit 0
            fi
            sleep 10
          done
          echo "FAIL: production German compound-language smoke did not pass."
          exit 1
