name: Fix Gemini Runtime Model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-runtime-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Replace unsupported Gemini runtime model with stable Gemini model
        shell: python
        run: |
          from pathlib import Path
          files = [
            Path('app/lib/router.ts'),
            Path('app/api/ask/route.ts'),
            Path('app/lib/standards-engine.ts'),
          ]
          changed = []
          for path in files:
            if not path.exists():
              continue
            text = path.read_text()
            updated = text.replace('gemini-3.5-flash-lite', 'gemini-2.5-flash')
            if updated != text:
              path.write_text(updated)
              changed.append(str(path))
          if not changed:
            raise SystemExit('No gemini-3.5-flash-lite runtime references found to repair')
          print('Updated:', ', '.join(changed))
      - name: Verify Gemini-first invariants
        run: |
          ! grep -R 'gemini-3.5-flash-lite' app/lib/router.ts app/api/ask/route.ts app/lib/standards-engine.ts
          grep -q 'gemini-2.5-flash' app/lib/router.ts
          grep -q 'google_search' app/api/ask/route.ts
          grep -q 'function verifyClaims' app/lib/standards-engine.ts
      - name: Build
        run: npm ci && npm run build
      - name: Commit repair
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/router.ts app/api/ask/route.ts app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Use stable Gemini runtime model for assistant core' && git push)
