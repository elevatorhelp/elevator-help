name: Apply Exact Standards Clause Retrieval

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-standards-exact-clause.yml'
      - 'scripts/patch-standards-exact-clause.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply exact-clause retrieval patch
        run: node scripts/patch-standards-exact-clause.mjs

      - name: Verify exact evidence path and safety invariants
        run: |
          grep -q 'EXACT_CLAUSE_VECTOR_CANDIDATES' app/lib/standards-engine.ts
          grep -q 'vectorize.getByIds' app/lib/standards-engine.ts
          grep -q '5.2.5.3.1' app/lib/standards-engine.ts
          grep -q '5.3.4.1' app/lib/standards-engine.ts
          grep -q 'Standards query item failed; continuing' app/lib/standards-engine.ts
          grep -q 'function verifyClaims' app/lib/standards-engine.ts
          grep -q 'evidenceContainsAllClaimNumbers' app/lib/standards-engine.ts

      - name: Build
        run: npm ci && npm run build

      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Use exact clause locators for standards clearance answers' && git push)
