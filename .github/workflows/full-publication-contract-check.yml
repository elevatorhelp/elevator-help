name: Isolated Complete Publication Check
on:
  push:
    branches: [feat/pr61-full-publication-20261024]
    paths:
      - 'app/lib/ingestion-full-publication.ts'
      - 'docs/ingestion-full-publication-schema.sql'
      - 'scripts/test-ingestion-full-publication.ts'
      - '.github/workflows/full-publication-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Exact three-layer RAW Evidence Map CAS contract
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-full-publication.ts
