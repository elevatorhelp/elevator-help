name: QA106 B Shadow durable D1 state diagnostic (READ ONLY)
on:
  push:
    branches:
      - feat/issue106-shadow-map-revision-20261122
    paths:
      - ".github/workflows/qa-issue106-b-shadow-state-readonly.yml"
permissions:
  contents: read
jobs:
  read-b-state:
    if: >-
      github.repository == 'elevatorhelp/elevator-help' &&
      github.ref == 'refs/heads/feat/issue106-shadow-map-revision-20261122' &&
      github.event.head_commit.message == 'qa106(readonly): inspect durable B Shadow after half-pair'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read aggregate B-only D1 state, never reveal source or vectors
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -z "${GEMINI_API_KEY:-}"
          tmp="$(mktemp -d "$RUNNER_TEMP/qa106-b-readonly.XXXXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          npx wrangler d1 list --json > "$tmp/d1.json" 2> "$tmp/d1.err"
          node --input-type=module - "$tmp/d1.json" <<'NODE'
          import {readFileSync} from "node:fs";
          const all=JSON.parse(readFileSync(process.argv[2],"utf8"));
          const xs=all.filter(x=>x.name==="elevator-help-lease-test-01");
          if(xs.length!==1 || (xs[0].uuid!=="02716877-15e3-4478-9e24-f1ba6e5dfb00" &&
            xs[0].id!=="02716877-15e3-4478-9e24-f1ba6e5dfb00"))
            throw Error("QA106_NOT_REVIEWED_D1");
          NODE
          SQL="SELECT
           (SELECT COUNT(*) FROM qa106_map_revisions WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn') AS revisions,
           (SELECT state FROM qa106_map_revisions WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn' LIMIT 1) AS phase,
           (SELECT COUNT(*) FROM qa106_map_revisions WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn' AND payload_json IS NOT NULL AND payload_sha256 IS NOT NULL) AS payloads,
           (SELECT COUNT(*) FROM qa106_map_revisions WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn' AND embeddings_json IS NOT NULL AND embeddings_sha256 IS NOT NULL) AS embedding_sets,
           (SELECT COUNT(*) FROM qa106_map_revision_provider_reservations WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn' AND purpose='map_generation') AS model_reserved,
           (SELECT COUNT(*) FROM qa106_map_revision_provider_reservations WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn' AND purpose='workers_ai_embedding') AS workers_reserved,
           (SELECT COUNT(*) FROM qa106_map_revision_provider_reservations WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn' AND purpose='gemini_embedding') AS gemini_embedding_reserved,
           (SELECT COUNT(*) FROM qa106_map_revision_receipts WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn') AS new_receipts,
           (SELECT COUNT(*) FROM qa106_map_revision_shadow_publications WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn') AS shadow_published,
           (SELECT COUNT(*) FROM ingestion_v2_publications WHERE document_id='1iybMaW8SaB3QfBLfdFJO5ymefVDdjmFn') AS legacy_b_published,
           (SELECT COUNT(*) FROM ingestion_v2_publications WHERE document_id='1cT2iBMx7pFDr_JKfZFBSG9xVFu3WZu3v') AS legacy_a_published;"
          npx wrangler d1 execute elevator-help-lease-test-01 --remote --config wrangler.qa-pr100-v2.json --json --command "$SQL" > "$tmp/result.json" 2>"$tmp/query.err"
          node --input-type=module - "$tmp/result.json" <<'NODE'
          import {readFileSync} from "node:fs";
          const v=JSON.parse(readFileSync(process.argv[2],"utf8"));
          const a=Array.isArray(v)?v:[v];
          const result=a.flatMap(x=>x.results||[])[0];
          if(!result||Object.keys(result).length!==11)throw Error("QA106_UNEXPECTED_AGGREGATE");
          for(const [key,value] of Object.entries(result)){
            if(!/^[a-z_]+$/.test(key))throw Error("QA106_UNEXPECTED_KEY");
            if(key==="phase"){
              if(!["planned","generated","embedded",null].includes(value))throw Error("QA106_INVALID_STATE");
            }else if(!Number.isSafeInteger(Number(value)) || Number(value)<0 || Number(value)>10)throw Error("QA106_INVALID_COUNT");
            console.log("QA106_B_"+key.toUpperCase()+"="+String(value));
          }
          console.log("PASS:QA106_B_D1_READONLY_NO_GEMINI");
          NODE
