name: Apply Gemini Upstream Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gemini-upstream-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Preserve safe upstream failure class for live diagnosis
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/api/ask/route.ts')
          s=p.read_text()
          s=s.replace('if (!response.ok) throw new Error("Product answer failed");', 'if (!response.ok) throw new Error(`GEMINI_PRODUCT_HTTP_${response.status}`);')
          s=s.replace('if (!response.ok) throw new Error("Retrieval translation failed");', 'if (!response.ok) throw new Error(`GEMINI_TRANSLATION_HTTP_${response.status}`);')
          s=s.replace('if (!response.ok) throw new Error("Web answer failed");', 'if (!response.ok) throw new Error(`GEMINI_WEB_HTTP_${response.status}`);')
          old='{ error: safeErrorMessage(detectedLanguage) },\n      { status: 500 }'
          new='{ error: safeErrorMessage(detectedLanguage), diagnosticCode: error instanceof Error && /^GEMINI_[A-Z_]+HTTP_\\d+$/.test(error.message) ? error.message : "ASK_PIPELINE_FAILURE" },\n      { status: 500 }'
          if old not in s:
            raise SystemExit('catch response anchor not found')
          s=s.replace(old,new)
          p.write_text(s)
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/api/ask/route.ts
          git diff --cached --quiet || (git commit -m 'Expose safe Gemini upstream failure class' && git push)
