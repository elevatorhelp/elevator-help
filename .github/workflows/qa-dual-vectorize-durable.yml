name: QA durable physical dual Vectorize proof
run-name: Isolated dual Vectorize insert/readback/cleanup with retained report
on:
  push:
    branches: [qa/durable-dual-vectorize-proof-20261109]
    paths:
      - .github/workflows/qa-dual-vectorize-durable.yml
      - scripts/qa-dual-vectorize-durable.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-durable-dual-vectorize-physical
  cancel-in-progress: false

jobs:
  physical-proof:
    if: github.repository == 'elevatorhelp/elevator-help' && (github.ref == 'refs/heads/qa/durable-dual-vectorize-proof-20261109' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact commit checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/qa-dual-vectorize-durable.mjs
      - name: Real isolated Vectorize dual-index proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/qa-dual-vectorize-durable.mjs
      - name: Retain redacted result even when test fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-dual-vectorize-durable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dual-vectorize-durable-qa.json
          if-no-files-found: warn
          retention-days: 30
