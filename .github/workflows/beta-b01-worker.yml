name: Beta B01 Inventory Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: beta-b01-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Collect read-only GitHub inventory and QA assertions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/beta_b01_inventory.py
      - name: Archive independent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-b01-evidence
          path: beta-b01-evidence.json
          retention-days: 30
