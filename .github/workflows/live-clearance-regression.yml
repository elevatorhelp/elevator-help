name: Live Standards Clearance Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-clearance-regression.yml'

jobs:
  clearance:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both natural clearance phrasings
        shell: bash
        run: |
          set -euo pipefail

          questions=(
            "wie viel ist min. abstand zwischen kabinenaufzug und schachtwand ?"
            "wie viel ist min. abstand zwischen kabin und schachtwand ?"
          )

          check_answer() {
            local body="$1"
            RESPONSE="$body" node <<'NODE'
          const body = process.env.RESPONSE || "";
          let data;
          try { data = JSON.parse(body); } catch { process.exit(2); }
          const answer = String(data.answer || "");
          const normalized = answer.toLowerCase().replace(/\s+/g, " ");
          const has150 = /(?:0[,.]15\s*m|150\s*mm)/i.test(answer);
          const has35 = /35\s*mm/i.test(answer);
          const valid =
            data.mode === "standards_knowledge_base" &&
            answer.includes("5.2.5.3.1") &&
            answer.includes("5.3.4.1") &&
            has150 &&
            has35 &&
            !answer.includes("2.1.1") &&
            !answer.includes("2.1.2") &&
            !/formuliere.*konkreter|bitte.*aufzug|bitte.*elevator/i.test(normalized);
          if (!valid) {
            console.error(JSON.stringify({ mode: data.mode, answer }, null, 2));
            process.exit(1);
          }
NODE
          }

          for attempt in $(seq 1 18); do
            echo "Attempt $attempt/18"
            all_ok=1
            for q in "${questions[@]}"; do
              body=$(curl -sS --max-time 90 -X POST https://elevator.help/api/ask \
                -H 'content-type: application/json' \
                --data "$(node -e 'process.stdout.write(JSON.stringify({question:process.argv[1]}))' "$q")") || body=""
              echo "Question: $q"
              echo "$body" | head -c 1500; echo
              if ! check_answer "$body"; then
                all_ok=0
                break
              fi
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "PASS: both phrasings return the verified clearance clauses and values."
              exit 0
            fi
            sleep 20
          done

          echo "FAIL: live clearance regression did not pass after deployment retries."
          exit 1
