name: Issue106 manual PDF B exact Map repair (MAX 4 Gemini calls)
run-name: Issue106 QA B-only missing original Map vector, never reindex PDF A
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type QA106_B_ONLY_MAX_4_GEMINI_CALLS to approve ONE billed B-only QA attempt"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false
jobs:
  b-only-repair:
    if: github.repository == 'elevatorhelp/elevator-help' && github.ref == 'refs/heads/main' && inputs.confirmation == 'QA106_B_ONLY_MAX_4_GEMINI_CALLS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Strict offline guards and B-only Map repair regression (NO billed calls)
        run: |
          set -euo pipefail
          bash -n scripts/qa-issue106-b-map-repair-run.sh
          node --check scripts/qa-issue106-b-repair-readonly.mjs
          node scripts/test-issue106-b-repair-readonly.mjs
          node scripts/test-issue106-b-repair-runner.mjs
          node --experimental-strip-types scripts/test-issue106-b-exact-map-repair.ts
      - name: Check both original Drive PDFs and source fingerprints (READ ONLY)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QA106_CONFIRMATION: QA_ONLY_TWO_PDFS_MAX_24_GEMINI_CALLS
          INGESTION_V2_QA_MODE: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/qa-issue106-drive-readonly.mjs
          node scripts/qa-issue106-resume-readonly.mjs
      - name: Block B-only repair unless A is published and B has exactly one missing Map receipt (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QA106_B_MAP_REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/qa-issue106-b-repair-readonly.mjs
      - name: Build QA Worker (NO Production deployment)
        run: npm run cf:build
      - name: Execute ONE bounded B-only exact repair, no paid retry or PDF A mutation
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
          QA106_B_MAP_REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/qa-issue106-b-map-repair-run.sh
      - name: Retain only sanitized publication PASS proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue106-b-only-exact-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/qa106-b-repair-proof.txt
          if-no-files-found: warn
          retention-days: 30
