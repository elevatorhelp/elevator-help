name: Security lockfile refresh (temporary)
on:
  push:
    branches:
      - security/next-16-4-2-20261023
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh Next.js security lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate consistent lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Next.js security lockfile'
            git push
          fi
