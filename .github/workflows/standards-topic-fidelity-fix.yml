name: One-shot standards topic fidelity fix

on:
  push:
    paths:
      - '.github/workflows/standards-topic-fidelity-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch standards topic fidelity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/lib/standards-engine.ts')
          text = p.read_text(encoding='utf-8')

          # 1) Add a strict lexical relevance helper for broad shaft structure evidence.
          insert_before = 'async function queryOneStandard('
          assert insert_before in text
          helper = '''function topicTextRelevant(text: string, topic: StandardTopic) {
            switch (topic) {
              case "structure":
                return /(schachtw(?:a|ä)nd|shaft wall|mechanische festigkeit|mechanical strength|festigkeit der w(?:a|ä)nde|verformung|deformation)/i.test(text);
              default:
                return true;
            }
          }

          '''
          text = text.replace(insert_before, helper + insert_before, 1)

          # 2) Compute broadness before retrieval and keep structure results on-topic.
          language_anchor = '  for (const sourceLanguage of languages) {'
          assert language_anchor in text
          text = text.replace(language_anchor, '  const broad = isBroadShaftQuestion(question);\n\n' + language_anchor, 1)

          valid_start = text.index('      const valid = (result.matches || [])')
          sort_anchor = '        .sort((a: any, b: any) => matchRank(b) - matchRank(a))'
          sort_pos = text.index(sort_anchor, valid_start)
          structure_filter = '''        .filter(
            (match: any) =>
              !broad ||
              item.topic !== "structure" ||
              topicTextRelevant(String(match?.metadata?.text || ""), "structure")
          )
'''
          text = text[:sort_pos] + structure_filter + text[sort_pos:]

          # Remove the later duplicate broad declaration.
          dup = '    const broad = isBroadShaftQuestion(question);\n    const topicOrder:'
          assert dup in text
          text = text.replace(dup, '    const topicOrder:', 1)

          # 3) Programmatically require the model claim topic to match its evidence topic.
          verify_anchor = '    if (!selected || selected.standardCode !== standard) continue;'
          assert verify_anchor in text
          text = text.replace(
            verify_anchor,
            verify_anchor + '\n    if (normalizeTopic(selected.standardSearchTopic) !== topic) continue;',
            1,
          )

          # 4) Never call a broad shaft answer sufficient unless structure + >=3 topics survived verification.
          selected_anchor = '  const selected = selectClaimsForAnswer(verified, retrieval.broad);'
          assert selected_anchor in text
          text = text.replace(
            selected_anchor,
            selected_anchor + '''
  const broadTopics = new Set(selected.map((claim) => claim.topic));
  const broadCoverageOk =
    !retrieval.broad || (broadTopics.has("structure") && broadTopics.size >= 3);''',
            1,
          )
          fail_anchor = '  if (!selected.length) {'
          assert fail_anchor in text
          text = text.replace(fail_anchor, '  if (!selected.length || !broadCoverageOk) {', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'elevatorhelp'
          git config user.email 'baharmand@hotmail.com'
          git rm .github/workflows/standards-topic-fidelity-fix.yml
          git add app/lib/standards-engine.ts
          git commit -m 'Enforce broad standards topic fidelity'
          git push
