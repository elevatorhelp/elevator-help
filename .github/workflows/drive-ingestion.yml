name: Drive ingestion

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: Google Drive root folder ID to scan recursively
        required: false
        default: "1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5"
      target_text_files:
        description: Stop after this many PDFs with extractable text are indexed
        required: false
        default: "2"
      max_scan_files:
        description: Maximum PDFs to inspect in one run while looking for text-bearing files
        required: false
        default: "20"
  push:
    branches: [main]
    paths:
      - '.github/workflows/drive-ingestion.yml'
      - 'scripts/drive-ingest.mjs'
      - 'scripts/drive-ingest-until-text.mjs'
      - 'app/api/document-map-ingest/route.ts'

concurrency:
  group: elevator-help-drive-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Vectorize metadata indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          existing=$(npx --yes wrangler@latest vectorize list-metadata-index elevator-help-index --json 2>/dev/null || true)

          ensure_index() {
            property="$1"
            if printf '%s' "$existing" | grep -q "\"propertyName\"[[:space:]]*:[[:space:]]*\"$property\""; then
              echo "Metadata index already exists: $property"
            else
              echo "Creating metadata index: $property"
              npx --yes wrangler@latest vectorize create-metadata-index elevator-help-index \
                --property-name="$property" --type=string
            fi
          }

          ensure_index contentType
          ensure_index language
          ensure_index documentGroup
          ensure_index sourceFileId

          # Metadata-index creation is asynchronous. Give Vectorize a short window,
          # then verify that all fields are visible before inserting/upserting vectors.
          for attempt in $(seq 1 12); do
            current=$(npx --yes wrangler@latest vectorize list-metadata-index elevator-help-index --json 2>/dev/null || true)
            missing=0
            for property in contentType language documentGroup sourceFileId; do
              printf '%s' "$current" | grep -q "\"propertyName\"[[:space:]]*:[[:space:]]*\"$property\"" || missing=1
            done
            if [ "$missing" -eq 0 ]; then
              echo "Required Vectorize metadata indexes are ready."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Required Vectorize metadata indexes did not become ready in time."
              exit 1
            fi
            sleep 5
          done

      - name: Restore ingestion state
        uses: actions/cache@v6
        with:
          path: .ingestion-state
          key: drive-ingestion-state-${{ github.run_id }}
          restore-keys: |
            drive-ingestion-state-

      - name: Guard Google JWT grant type
        run: |
          sed -i 's#urn:ietf:params:oauth-grant-type:jwt-bearer#urn:ietf:params:oauth:grant-type:jwt-bearer#g' scripts/drive-ingest.mjs
          grep -q 'urn:ietf:params:oauth:grant-type:jwt-bearer' scripts/drive-ingest.mjs

      - name: Ingest Google Drive PDFs and document maps
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
          DRIVE_FOLDER_ID: ${{ inputs.folder_id || '1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5' }}
          TARGET_TEXT_FILES: ${{ inputs.target_text_files || '2' }}
          MAX_SCAN_FILES: ${{ inputs.max_scan_files || '20' }}
          INGEST_ENDPOINT: https://elevator.help/api/drive-ingest-batch
          DOCUMENT_MAP_ENDPOINT: https://elevator.help/api/document-map-ingest
        run: node scripts/drive-ingest-until-text.mjs
