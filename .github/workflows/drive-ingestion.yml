name: Drive ingestion

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: Google Drive root folder ID to scan recursively
        required: false
        default: "1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5"
      target_text_files:
        description: Stop after this many PDFs with extractable text are indexed
        required: false
        default: "2"
      max_scan_files:
        description: Maximum PDFs to inspect in one run while looking for text-bearing files
        required: false
        default: "20"

concurrency:
  group: elevator-help-drive-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore ingestion state
        uses: actions/cache@v6
        with:
          path: .ingestion-state
          key: drive-ingestion-state-${{ github.run_id }}
          restore-keys: |
            drive-ingestion-state-

      - name: Ingest Google Drive PDFs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
          DRIVE_FOLDER_ID: ${{ inputs.folder_id }}
          TARGET_TEXT_FILES: ${{ inputs.target_text_files }}
          MAX_SCAN_FILES: ${{ inputs.max_scan_files }}
          INGEST_ENDPOINT: https://elevator.help/api/drive-ingest-batch
        run: node scripts/drive-ingest-until-text.mjs
