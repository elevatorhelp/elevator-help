name: Drive ingestion

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      folder_id:
        description: Google Drive root folder ID to scan recursively
        required: false
        default: "1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5"
      target_file_id:
        description: Optional single Drive file ID to ingest for a bounded test
        required: false
      target_text_files:
        description: Stop after this many PDFs with extractable text are indexed
        required: false
        default: "10"
      max_scan_files:
        description: Maximum PDFs to inspect in one run while looking for text-bearing files
        required: false
        default: "100"
  push:
    branches: [main]
    paths:
      - '.github/workflows/drive-ingestion.yml'
      - 'scripts/drive-ingest.mjs'
      - 'scripts/drive-ingest-until-text.mjs'
      - 'app/api/document-map-ingest/route.ts'
      - 'app/api/drive-ingest-batch/route.ts'
      - 'app/lib/multilingual-embedding.ts'

concurrency:
  group: elevator-help-drive-ingestion
  cancel-in-progress: false

# State is checkpointed independently for raw vectors and document-map windows so
# a quota-limited map run can resume without rebuilding already verified layers.
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Office document converter
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice

      - name: Ensure Vectorize metadata indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          for index in elevator-help-index elevator-help-multilingual-v2; do
            current=$(npx --yes wrangler@4.125.0 vectorize list-metadata-index "$index" --json)
            for property in contentType language documentGroup manufacturer controller faultFamily faultCode sourceFingerprint status; do
              if ! printf '%s' "$current" | grep -q "\"propertyName\"[[:space:]]*:[[:space:]]*\"$property\""; then
                echo "Creating missing metadata index: $index.$property"
                npx --yes wrangler@4.125.0 vectorize create-metadata-index "$index" --property-name "$property" --type string
              fi
            done
            if ! printf '%s' "$current" | grep -q '"propertyName"[[:space:]]*:[[:space:]]*"embeddingVersion"'; then
              npx --yes wrangler@4.125.0 vectorize create-metadata-index "$index" --property-name embeddingVersion --type number
            fi
          done
          echo "Required Vectorize metadata indexes are available or have been requested."

      - name: Wait for multilingual ingestion endpoint
        env:
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl -sS -o /tmp/ingest-readiness.json \
              -X POST https://elevator.help/api/drive-ingest-batch \
              -H "Authorization: Bearer $ELEVATOR_INGESTION_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"action":"status"}'
            if grep -q '"rawEmbeddingVersion":3' /tmp/ingest-readiness.json && \
               grep -q '"legacyConfigured":true' /tmp/ingest-readiness.json && \
               grep -q '"multilingualConfigured":true' /tmp/ingest-readiness.json; then
              exit 0
            fi
            sleep 20
          done
          cat /tmp/ingest-readiness.json
          exit 1

      - name: Restore ingestion state
        uses: actions/cache/restore@v6
        with:
          path: .ingestion-state
          key: drive-ingestion-state-${{ github.run_id }}
          restore-keys: |
            drive-ingestion-state-

      - name: Guard Google JWT grant type
        run: |
          sed -i 's#urn:ietf:params:oauth-grant-type:jwt-bearer#urn:ietf:params:oauth:grant-type:jwt-bearer#g' scripts/drive-ingest.mjs
          grep -q 'urn:ietf:params:oauth:grant-type:jwt-bearer' scripts/drive-ingest.mjs

      - name: Ingest Google Drive PDFs and document maps
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
          DRIVE_FOLDER_ID: ${{ inputs.folder_id || '1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5' }}
          TARGET_FILE_ID: ${{ inputs.target_file_id || '' }}
          TARGET_TEXT_FILES: ${{ inputs.target_text_files || '10' }}
          MAX_SCAN_FILES: ${{ inputs.max_scan_files || '100' }}
          INGEST_ENDPOINT: https://elevator.help/api/drive-ingest-batch
          DOCUMENT_MAP_ENDPOINT: https://elevator.help/api/document-map-ingest
        run: node scripts/drive-ingest-until-text.mjs

      - name: Save ingestion state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ingestion-state
          key: drive-ingestion-state-${{ github.run_id }}
