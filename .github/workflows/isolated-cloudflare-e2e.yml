name: Isolated Cloudflare D1 Vectorize smoke test
on:
  workflow_dispatch:
    inputs:
      allow_isolated_cloudflare_qa:
        description: Explicitly authorize writes and quota usage in isolated Cloudflare QA resources
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: qa-pr61-cloudflare-smoke
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_isolated_cloudflare_qa == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Check isolated D1 and Vectorize publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/qa-isolated-cloudflare-e2e.mjs
