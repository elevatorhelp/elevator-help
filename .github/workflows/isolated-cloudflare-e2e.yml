name: Isolated Cloudflare D1 Vectorize smoke test
on:
  workflow_dispatch:
    inputs:
      allow_isolated_cloudflare_qa:
        description: Explicitly authorize writes and quota usage in isolated Cloudflare QA resources
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: qa-pr61-cloudflare-smoke
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_isolated_cloudflare_qa == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Verify exact current PR63 HEAD before remote Cloudflare QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/pr61-reconciled-20261024" || {
            echo "::error::Remote QA must select canonical PR63 integration branch"
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::QA checkout differs from dispatched commit"
            exit 1
          }
          current_sha=$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/63" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.state!=="open"||p.head?.ref!=="integration/pr61-reconciled-20261024")process.exit(1);process.stdout.write(p.head.sha)})')
          test "$current_sha" = "$GITHUB_SHA" || {
            echo "::error::Dispatched QA commit is not current PR63 HEAD"
            exit 1
          }
      - name: Check isolated D1 and Vectorize publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/qa-isolated-cloudflare-e2e.mjs
