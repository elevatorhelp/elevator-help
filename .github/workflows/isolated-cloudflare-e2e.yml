name: Isolated Cloudflare D1 Vectorize smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/isolated-cloudflare-e2e.yml
      - scripts/qa-isolated-cloudflare-e2e.mjs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Check isolated D1 and Vectorize publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/qa-isolated-cloudflare-e2e.mjs
