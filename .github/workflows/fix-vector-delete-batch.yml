name: One-shot vector delete batch fix

on:
  push:
    paths:
      - '.github/workflows/fix-vector-delete-batch.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Vectorize delete batch size
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/i += 200/i += 100/' scripts/drive-ingest.mjs
          sed -i 's/ids.slice(i, i + 200)/ids.slice(i, i + 100)/' scripts/drive-ingest.mjs
          grep -q 'i += 100' scripts/drive-ingest.mjs
          grep -q 'ids.slice(i, i + 100)' scripts/drive-ingest.mjs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/drive-ingest.mjs; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/drive-ingest.mjs
          git commit -m 'Fix Vectorize delete batch limit'
          git push origin HEAD:main
