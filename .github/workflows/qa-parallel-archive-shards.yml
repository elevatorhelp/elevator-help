name: QA parallel archive shard isolation
run-name: Parallel archive shard offline QA

on:
  pull_request:
    paths:
      - "scripts/archive-sharding.mjs"
      - "scripts/prepare-parallel-shard.mjs"
      - "scripts/test-archive-sharding.mjs"
      - "scripts/dual-indexer-checkpoint.mjs"
      - "scripts/run-dual-archive-indexers.mjs"
      - "scripts/test-dual-indexer-checkpoint.mjs"
      - ".github/workflows/drive-ingestion.yml"
      - ".github/workflows/qa-parallel-archive-shards.yml"
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: "Exact prior serial ingestion run ID (read-only checkpoint)"
        required: true
        type: string
      checkpoint_attempt:
        description: "Exact serial run attempt"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  shard0:
    name: Offline shard 0
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Test deterministic shard assignment and state preservation
        run: node scripts/test-archive-sharding.mjs
      - name: Test two-process state merge and serial fallback
        run: node scripts/test-dual-indexer-checkpoint.mjs
      - name: Install dependencies for optional real-checkpoint test
        if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Restore exact existing serial checkpoint (read only)
        if: github.event_name == 'workflow_dispatch'
        id: checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ingestion-state
          key: drive-ingestion-state-${{ inputs.checkpoint_run_id }}-${{ inputs.checkpoint_attempt }}
      - name: Reject missing checkpoint before migration
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${{ steps.checkpoint.outputs.cache-hit }}" = "true"
          test -s .ingestion-state/drive.json
      - name: Migrate only shard 0 checkpoint (offline)
        if: github.event_name == 'workflow_dispatch'
        env:
          ARCHIVE_SHARD_INDEX: "0"
          ARCHIVE_SHARD_COUNT: "2"
          ALLOW_LEGACY_SHARD_BOOTSTRAP: "true"
          STATE_PATH: .ingestion-state/drive.json
        run: |
          node scripts/prepare-parallel-shard.mjs
          node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(".ingestion-state/drive.json"));if(s.parallelShard.index!==Number(process.env.ARCHIVE_SHARD_INDEX))process.exit(1)'
          echo "PASS: shard 0 checkpoint restored and partitioned; no remote writes"
      # Never cache/save the migrated state or call paid ingestion APIs in QA.

  shard1:
    name: Offline shard 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Test deterministic shard assignment and state preservation
        run: node scripts/test-archive-sharding.mjs
      - name: Test two-process state merge and serial fallback
        run: node scripts/test-dual-indexer-checkpoint.mjs
      - name: Install dependencies for optional real-checkpoint test
        if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Restore exact existing serial checkpoint (read only)
        if: github.event_name == 'workflow_dispatch'
        id: checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ingestion-state
          key: drive-ingestion-state-${{ inputs.checkpoint_run_id }}-${{ inputs.checkpoint_attempt }}
      - name: Reject missing checkpoint before migration
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${{ steps.checkpoint.outputs.cache-hit }}" = "true"
          test -s .ingestion-state/drive.json
      - name: Migrate only shard 1 checkpoint (offline)
        if: github.event_name == 'workflow_dispatch'
        env:
          ARCHIVE_SHARD_INDEX: "1"
          ARCHIVE_SHARD_COUNT: "2"
          ALLOW_LEGACY_SHARD_BOOTSTRAP: "true"
          STATE_PATH: .ingestion-state/drive.json
        run: |
          node scripts/prepare-parallel-shard.mjs
          node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(".ingestion-state/drive.json"));if(s.parallelShard.index!==Number(process.env.ARCHIVE_SHARD_INDEX))process.exit(1)'
          echo "PASS: shard 1 checkpoint restored and partitioned; no remote writes"
      # Never cache/save the migrated state or call paid ingestion APIs in QA.
