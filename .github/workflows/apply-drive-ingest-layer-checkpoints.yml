name: Apply Drive Ingestion Layer Checkpoints

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-drive-ingest-layer-checkpoints.mjs'
      - '.github/workflows/apply-drive-ingest-layer-checkpoints.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply resumable ingestion patch
        run: node scripts/patch-drive-ingest-layer-checkpoints.mjs
      - name: Verify safety invariants
        run: |
          grep -q 'RAW_EMBEDDING_VERSION = 2' scripts/drive-ingest.mjs
          grep -q 'DOCUMENT_MAP_VERSION = 3' scripts/drive-ingest.mjs
          grep -q 'Raw-vector checkpoint saved' scripts/drive-ingest.mjs
          grep -q 'Document-map checkpoint saved' scripts/drive-ingest.mjs
          grep -q 'ingestRaw: true' scripts/drive-ingest.mjs
          grep -q 'ingestMap: true' scripts/drive-ingest.mjs
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/drive-ingest.mjs
          git diff --cached --quiet || (git commit -m 'Checkpoint raw and map ingestion independently' && git push)
