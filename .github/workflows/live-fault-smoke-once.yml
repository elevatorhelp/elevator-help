name: One-shot fault clarification smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-fault-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test German bare fault code clarification
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 90 -X POST https://elevator.help/api/ask \
            -H 'Content-Type: application/json' \
            --data '{"question":"Was bedeutet der Fehlercode 22455A?"}' > /tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const answer=String(data.answer||'');
          if(data.mode !== 'clarification' || !answer.includes('Newlift, Weber, Sigma')) {
            console.error(JSON.stringify(data,null,2)); process.exit(1);
          }
          console.log('PASS: German bare-code clarification is live.');
          NODE
