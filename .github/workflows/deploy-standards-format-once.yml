name: Deploy standards format production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-standards-format-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test German compound language
        run: npm run test:language

      - name: Test standards presentation
        run: npm run test:standards-presentation

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name elevator-help --keep-vars
