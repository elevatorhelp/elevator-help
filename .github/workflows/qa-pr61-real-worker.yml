name: PR61 real Worker isolated E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-pr61-real-worker.yml
permissions:
  contents: read
concurrency:
  group: qa-pr61-real-worker
  cancel-in-progress: false
jobs:
  isolated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audited PR61 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 840714bbf9e12e666bfd53eb63a1a010133e64dd
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Bootstrap isolated D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute elevator-help-lease-test-01 --remote --config wrangler.qa-staged.json --file scripts/qa-pr61-bootstrap.sql
      - name: Run PR61 Worker with remote test bindings and execute E2E
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          QA_RUN_TOKEN=$(openssl rand -hex 24)
          export QA_RUN_TOKEN
          npx wrangler dev --remote --config wrangler.qa-staged.json --ip 127.0.0.1 --port 8787 --var QA_RUN_TOKEN:"$QA_RUN_TOKEN" > /tmp/qa-worker-log.txt 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 70); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "X-QA-Token: $QA_RUN_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"documentId":"invalid"}' \
              http://127.0.0.1:8787/lease || true)
            if [ "$status" = "400" ]; then ready=1; break; fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Worker did not start; sanitized log tail:"
            tail -50 /tmp/qa-worker-log.txt | sed -E 's/[a-f0-9]{48}/[REDACTED]/g'
            exit 1
          fi
          node scripts/qa-pr61-worker-e2e.mjs
