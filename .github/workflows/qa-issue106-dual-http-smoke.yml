name: Issue106 two actual remote QA Worker HTTP lease smoke (NO Gemini)
on:
  push:
    branches: [qa/issue106-main-aligned-manual-parallel-20261115]
    paths:
      - ".github/workflows/qa-issue106-dual-http-smoke.yml"
      - "scripts/qa-issue106-dual-worker-http-smoke.mjs"
permissions:
  contents: read
concurrency:
  group: issue106-dual-http-smoke-no-gemini
  cancel-in-progress: false
jobs:
  two-remote-qa:
    if: github.repository == 'elevatorhelp/elevator-help'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/qa-issue106-dual-worker-http-smoke.mjs
      - run: npm run cf:build
      - name: Start two remote Cloudflare QA previews and prove distinct D1 owners
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          export QA106_SMOKE_TOKEN_A="$(openssl rand -hex 32)"
          export QA106_SMOKE_TOKEN_B="$(openssl rand -hex 32)"
          ROOT=1TgIo8chX2GTD4Rdx9QCA5RrqBM64gOgC
          start() {
            local slot="$1" port token
            if [ "$slot" = A ]; then
              port=8787
              token="$QA106_SMOKE_TOKEN_A"
            elif [ "$slot" = B ]; then
              port=8788
              token="$QA106_SMOKE_TOKEN_B"
            else exit 2; fi
            npx wrangler dev --remote --config wrangler.qa-pr100-v2.json \
              --ip 127.0.0.1 --port "$port" \
              --var "INGESTION_TOKEN:$token" \
              --var "INGESTION_COORDINATOR_JOB_KEY:drive:$ROOT""_qa_$slot" \
              --var "INGESTION_COORDINATOR_ENABLED:true" \
              --var "INGESTION_GLOBAL_WRITE_GATE_ENABLED:true" \
              --var "INGESTION_IMMUTABLE_PUBLICATION_ENABLED:true" \
              > "$RUNNER_TEMP/private-qa106-worker-$slot.log" 2>&1 &
            if [ "$slot" = A ]; then PID_A=$!; else PID_B=$!; fi
            local code ready=0
            for attempt in $(seq 1 75); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 4 \
                -X POST -H "Authorization: Bearer $token" \
                -H "Content-Type: application/json" \
                --data '{"action":"status"}' \
                "http://127.0.0.1:$port/api/drive-ingest-batch" 2>/dev/null || true)
              if [ "$code" = 200 ]; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then echo "::error::QA106_REMOTE_WORKER_NOT_READY"; exit 1; fi
          }
          PID_A=""
          PID_B=""
          trap 'kill "$PID_A" "$PID_B" 2>/dev/null || true; rm -f "$RUNNER_TEMP"/private-qa106-worker-*.log' EXIT
          start A
          start B
          node scripts/qa-issue106-dual-worker-http-smoke.mjs
      # No Drive, Gemini, production D1, user source, index insert or paid model calls.
