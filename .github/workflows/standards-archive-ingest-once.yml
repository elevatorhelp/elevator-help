name: One-shot standards archive ingest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standards-archive-ingest-once.yml'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice
      - name: Ingest authoritative EN 81-20 source
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
          DRIVE_FOLDER_ID: 1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5
          TARGET_FILE_ID: 1pY3acVvS97VaUe-HJANvJyI1Y4AavIPl
          TARGET_TEXT_FILES: 1
          MAX_SCAN_FILES: 1
          INGEST_ENDPOINT: https://elevator.help/api/drive-ingest-batch
          DOCUMENT_MAP_ENDPOINT: https://elevator.help/api/document-map-ingest
        run: node scripts/drive-ingest-until-text.mjs
