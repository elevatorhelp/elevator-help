name: Live Standards Smoke

# Phase 1 Beta gate is the Gemini-first conversational core. Standards are a
# later specialist gate, so this workflow must not hammer the live API on every
# push while the conversational path is being stabilized.
on:
  workflow_dispatch:

jobs:
  clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test both natural car-to-shaft-wall questions
        shell: bash
        run: |
          set -u
          QUESTIONS=(
            'wie viel ist min. abstand zwischen kabinenaufzug und schachtwand ?'
            'wie viel ist min. abstand zwischen kabin und schachtwand ?'
          )
          for QUESTION in "${QUESTIONS[@]}"; do
            RESPONSE=$(curl -sS --max-time 60 \
              -H 'content-type: application/json' \
              --data "$(jq -nc --arg q "$QUESTION" '{question:$q}')" \
              https://elevator.help/api/ask || true)
            ANSWER=$(printf '%s' "$RESPONSE" | jq -r '.answer // empty' 2>/dev/null || true)
            MODE=$(printf '%s' "$RESPONSE" | jq -r '.mode // empty' 2>/dev/null || true)
            echo "Question: $QUESTION"
            echo "mode=$MODE"
            printf '%s\n' "$ANSWER"
            if [[ "$MODE" != "standards_knowledge_base" ]] \
              || ! grep -q '5\.2\.5\.3\.1' <<<"$ANSWER" \
              || ! grep -q '5\.3\.4\.1' <<<"$ANSWER" \
              || ! grep -Eq '0[,.]15[[:space:]]*m|150[[:space:]]*mm' <<<"$ANSWER" \
              || ! grep -Eq '35[[:space:]]*mm' <<<"$ANSWER"; then
              echo 'FAIL: clearance answer did not reach the verified standards gate.'
              exit 1
            fi
          done
          echo 'PASS: both clearance phrasings returned verified clauses and values.'

  broad-shaft:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test broad shaft answer once
        shell: bash
        run: |
          set -u
          QUESTION='Was sagt die Norm über den Aufzugsschacht?'
          RESPONSE=$(curl -sS --max-time 60 \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg q "$QUESTION" '{question:$q}')" \
            https://elevator.help/api/ask || true)
          ANSWER=$(printf '%s' "$RESPONSE" | jq -r '.answer // empty' 2>/dev/null || true)
          MODE=$(printf '%s' "$RESPONSE" | jq -r '.mode // empty' 2>/dev/null || true)
          echo "mode=$MODE"
          printf '%s\n' "$ANSWER"
          CLAUSE_COUNT=$(printf '%s' "$ANSWER" | (grep -o 'Abschnitt [0-9][0-9.]*' || true) | sort -u | wc -l | tr -d ' ')
          if [[ "$MODE" == "standards_knowledge_base" ]] \
            && grep -q 'EN 81-20, Abschnitt 5\.2\.1\.8\.2' <<<"$ANSWER" \
            && [[ "$CLAUSE_COUNT" -ge 3 ]]; then
            echo 'PASS: broad shaft answer is grounded and diversified.'
            exit 0
          fi
          echo 'FAIL: broad shaft answer did not reach the verified standards gate.'
          exit 1
