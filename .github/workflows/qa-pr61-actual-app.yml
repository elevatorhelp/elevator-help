name: PR61 actual application isolated E2E
on:
  workflow_dispatch:
    inputs:
      allow_isolated_d1_mutation:
        description: "Explicitly authorize writes to the existing isolated QA D1 and Cloudflare quota usage"
        type: boolean
        required: true
        default: false
      allow_paid_gemini:
        description: "Explicitly permit one bounded real Gemini QA run (default: no)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qa-pr61-actual-app
  cancel-in-progress: false
jobs:
  actual-app:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_isolated_d1_mutation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact dispatched branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Dependencies
        run: npm ci
      - name: Validate isolated credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN unavailable"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID unavailable"; exit 1; }
          if [ "${{ inputs.allow_paid_gemini || false }}" = "true" ] && [ -z "$GEMINI_API_KEY" ]; then echo "::error::Paid QA opted in but Gemini key missing"; exit 1; fi
      - name: Verify exact lockfile-pinned OpenNext and Next versions
        run: |
          test "$(node -p 'require("next/package.json").version')" = "16.4.2"
          test "$(node -p 'require("./node_modules/@opennextjs/cloudflare/package.json").version')" = "1.20.12"
      - name: Build actual OpenNext Worker
        run: npm run cf:build
      - name: Bootstrap isolated D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute elevator-help-lease-test-01 --remote --config wrangler.qa-app.json --file scripts/qa-pr61-bootstrap.sql
      - name: Reconcile isolated QA lease timestamp schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/qa-pr61-ensure-lease-schema.mjs
      - name: Execute actual route against isolated Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOW_PAID_GEMINI: ${{ inputs.allow_paid_gemini }}
        run: |
          set -euo pipefail
          QA_INGESTION_TOKEN=$(openssl rand -hex 24)
          export QA_INGESTION_TOKEN
          VARS=(--var "INGESTION_TOKEN:$QA_INGESTION_TOKEN")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${ALLOW_PAID_GEMINI:-false}" = "true" ] && [ -n "$GEMINI_API_KEY" ]; then
            export QA_NEGATIVE_ONLY=false
            VARS+=(--var "GEMINI_API_KEY:$GEMINI_API_KEY")
          else
            export QA_NEGATIVE_ONLY=true
          fi
          npx wrangler dev --remote --config wrangler.qa-app.json --ip 127.0.0.1 --port 8787 "${VARS[@]}" \
            > /tmp/qa-app-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 75); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $QA_INGESTION_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"action":"status"}' \
              http://127.0.0.1:8787/api/drive-ingest-batch || true)
            if [ "$code" = "409" ]; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Actual OpenNext Worker not ready. Last HTTP status: $code"
            grep -E 'ERROR|Error|error|ready|Listening|Remote|Failed|fetch|wrangler|Binding' /tmp/qa-app-worker.log | tail -35 | sed -E 's/[a-f0-9]{32,}/[REDACTED]/g' || true
            exit 1
          fi
          node scripts/qa-pr61-real-app-e2e.mjs
