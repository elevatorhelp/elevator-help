name: Issue106 B Shadow model-free half-index reconciliation
on:
  push:
    branches: [feat/issue106-shadow-map-revision-20261122]
    paths:
      - ".github/workflows/qa-issue106-b-shadow-reconcile-once.yml"
permissions:
  contents: read
concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false
jobs:
  model-free-b-reconcile:
    if: >-
      github.repository == 'elevatorhelp/elevator-help' &&
      github.ref == 'refs/heads/feat/issue106-shadow-map-revision-20261122' &&
      github.event.head_commit.message == 'qa106(recover): reconcile B dual Vectorize without provider calls'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QA106_B_SHADOW_CONFIRMATION: QA106_B_SHADOW_RECOVERY_NO_MODEL
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Reconcile scripts syntax, no model keys
        run: |
          set -euo pipefail
          bash -n scripts/qa-issue106-b-shadow-reconcile-run.sh
          node --check scripts/qa-issue106-b-shadow-reconcile-client.mjs
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GEMINI_BENCHMARK_API_KEY:-}"
      - name: Build QA Worker; never deploy Production
        run: npm run cf:build
      - name: Reconcile only existing persisted B vectors, never regenerate
        run: bash scripts/qa-issue106-b-shadow-reconcile-run.sh
