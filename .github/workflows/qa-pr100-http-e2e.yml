name: PR100 isolated Cloudflare V2 HTTP E2E
run-name: Physical immutable D1 Evidence plus dual Vectorize publication QA

on:
  push:
    branches: [feature/drive-runner-v2-qa-20261109]
    paths:
      - ".github/workflows/qa-pr100-http-e2e.yml"
      - "scripts/qa-pr100-immutable-http.mjs"
      - "wrangler.qa-pr100-v2.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-pr100-http-cloudflare-v2
  cancel-in-progress: false

jobs:
  isolated-http:
    if: github.repository == 'elevatorhelp/elevator-help' && (github.ref == 'refs/heads/feature/drive-runner-v2-qa-20261109' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Preflight isolated cloud account credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::QA_CLOUDFLARE_TOKEN_REQUIRED"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::QA_CLOUDFLARE_ACCOUNT_REQUIRED"; exit 1; }
          node --check scripts/qa-pr100-immutable-http.mjs
      - name: Build actual application Worker
        run: npm run cf:build
      - name: Install additive tables in isolated QA D1 (never Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for schema in \
            docs/ingestion-global-coordinator-schema.sql \
            docs/ingestion-immutable-publication-schema.sql \
            docs/ingestion-v2-document-epoch-schema.sql \
            docs/ingestion-v2-evidence-reference-schema.sql; do
            npx wrangler d1 execute elevator-help-lease-test-01 --remote \
              --config wrangler.qa-pr100-v2.json --file "$schema" > /dev/null
          done
          echo "PASS: additive QA-only D1 tables ready"
      - name: Run real QA Worker and synthetic HTTP staging contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export QA_V2_INGESTION_TOKEN="$(openssl rand -hex 24)"
          export QA_V2_JOB_KEY="drive:QaFixtureRoot_${GITHUB_RUN_ID}"
          npx wrangler dev --remote --config wrangler.qa-pr100-v2.json \
            --ip 127.0.0.1 --port 8787 \
            --var "INGESTION_TOKEN:${QA_V2_INGESTION_TOKEN}" \
            --var "INGESTION_COORDINATOR_JOB_KEY:${QA_V2_JOB_KEY}" \
            --var "INGESTION_COORDINATOR_ENABLED:true" \
            --var "INGESTION_GLOBAL_WRITE_GATE_ENABLED:true" \
            --var "INGESTION_IMMUTABLE_PUBLICATION_ENABLED:true" \
            > "$RUNNER_TEMP/qa-pr100-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 85); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              -X POST -H "Authorization: Bearer ${QA_V2_INGESTION_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"action":"status"}' \
              http://127.0.0.1:8787/api/drive-ingest-batch || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::QA_REMOTE_WORKER_NOT_READY"
            # No raw worker logs, source paths, tokens or request bodies.
            exit 1
          fi
          node scripts/qa-pr100-immutable-http.mjs
      - name: Retain sanitized HTTP evidence even on failed test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-pr100-v2-http-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-pr100-real-http.json
          if-no-files-found: warn
          retention-days: 30
