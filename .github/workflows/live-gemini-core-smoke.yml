name: Live Gemini Core Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  conversational-core:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test minimal Gemini-first conversation once
        shell: bash
        run: |
          set -u
          QUESTION='Bist du da?'
          RESPONSE=$(curl -sS --max-time 45 \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg q "$QUESTION" '{question:$q}')" \
            https://elevator.help/api/ask || true)
          echo "$RESPONSE" | jq -c '{mode,answer,error,diagnosticCode}' 2>/dev/null || echo "$RESPONSE"
          ANSWER=$(printf '%s' "$RESPONSE" | jq -r '.answer // empty' 2>/dev/null || true)
          ERROR=$(printf '%s' "$RESPONSE" | jq -r '.error // empty' 2>/dev/null || true)
          MODE=$(printf '%s' "$RESPONSE" | jq -r '.mode // empty' 2>/dev/null || true)
          if [[ -n "$ERROR" || -z "$ANSWER" || "$MODE" != "gemini_direct" ]]; then
            echo 'FAIL: minimal direct Gemini path is not live-green.'
            exit 1
          fi
          echo 'PASS: minimal direct Gemini conversation is live-green.'
