name: Apply Standards Plan Priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-standards-plan-priority.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Prioritize deterministic exact-clause queries
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/lib/standards-engine.ts')
          text = p.read_text()
          old = 'const plan = [...mapQueries, ...basePlan].filter((item, index, all) => {'
          new = '''// Deterministic intent queries come first. Map-derived hints are useful expansion,
          // but must never consume the bounded plan before exact-clause candidates such as
          // 5.2.5.3.1 / 5.3.4.1 can reach raw-evidence verification.
          const plan = [...basePlan, ...mapQueries].filter((item, index, all) => {'''
          if old not in text:
            raise SystemExit('Expected standards plan marker not found')
          p.write_text(text.replace(old, new, 1))
      - name: Verify standards safety invariants
        run: |
          grep -q 'const plan = \[...basePlan, ...mapQueries\]' app/lib/standards-engine.ts
          grep -q 'function verifyClaims' app/lib/standards-engine.ts
          grep -q 'EXACT_CLAUSE_VECTOR_CANDIDATES' app/lib/standards-engine.ts
      - name: Build Check
        run: npm ci && npm run build
      - name: Commit repair
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Prioritize deterministic standards evidence queries' && git push)
      - name: Live standards clearance QA
        run: |
          QUESTIONS=(
            'wie viel ist min. abstand zwischen kabinenaufzug und schachtwand ?'
            'wie viel ist min. abstand zwischen kabin und schachtwand ?'
          )
          for attempt in $(seq 1 24); do
            all_ok=1
            for q in "${QUESTIONS[@]}"; do
              response=$(curl -sS --max-time 60 -H 'content-type: application/json' --data "$(jq -nc --arg q "$q" '{question:$q}')" https://elevator.help/api/ask || true)
              echo "$response" | jq -c '{mode,answer,error}' 2>/dev/null || true
              answer=$(printf '%s' "$response" | jq -r '.answer // empty' 2>/dev/null || true)
              mode=$(printf '%s' "$response" | jq -r '.mode // empty' 2>/dev/null || true)
              if [[ "$mode" != 'standards_knowledge_base' ]] || ! grep -q '5\.2\.5\.3\.1' <<<"$answer" || ! grep -q '5\.3\.4\.1' <<<"$answer" || ! grep -Eq '0[,.]15[[:space:]]*m|150[[:space:]]*mm' <<<"$answer" || ! grep -Eq '35[[:space:]]*mm' <<<"$answer"; then
                all_ok=0
                break
              fi
            done
            [[ "$all_ok" -eq 1 ]] && exit 0
            sleep 20
          done
          exit 1
