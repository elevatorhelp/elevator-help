name: Manual exact-head offline Build Check
on:
  push:
    branches: [qa/pr69-exact-head-ci-20261024]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full reviewed SHA; must equal dispatched ref HEAD
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-exact-head-build
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  CI: "true"
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/qa/pr69-exact-head-ci-20261024')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate approval before checkout
        env:
          APPROVED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.approved_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$DISPATCH_SHA"
      - name: Checkout approved immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Verify actual checkout
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Workflow safety and static security
        run: |
          node scripts/test-qa-exact-head-workflow.cjs
          node scripts/guard-next-security-baseline.mjs
          node scripts/test-security-baseline.mjs
          node --check scripts/qa-authenticated-ask-citation.mjs
      - name: Offline regression suite
        run: node scripts/qa-ci-offline.cjs
      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Build locked Next and OpenNext without service credentials
        run: npm run cf:build
      - name: Production dependency advisory audit (required)
        run: npm audit --omit=dev --audit-level=high
      - name: Ensure dependency lock unchanged
        run: git diff --exit-code -- package.json package-lock.json
