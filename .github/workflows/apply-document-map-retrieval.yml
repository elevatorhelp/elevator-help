name: Apply Document Map Retrieval

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make filtered standards recall fail open to verified raw search
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('app/lib/standards-engine.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const queryWithFilter = async (filter?: Record<string, string>) => {
    const result = await vectorize.query(queryVector, {
      topK: 80,
      returnMetadata: "all",
      ...(filter ? { filter } : {}),
    });

    return (result.matches || [])
      .filter(
        (match: any) =>
          match?.metadata?.contentType !== "document-map" &&
          typeof match?.metadata?.text === "string" &&
          match.metadata.text.trim().length > 0 &&
          matchBelongsToStandard(match, standard.compact) &&
          Number(match?.score || 0) >= minimumScore
      )
      .sort((a: any, b: any) => matchRank(b) - matchRank(a))
      .slice(0, 6)
      .map((match: any) => ({
        ...match,
        standardSearchTopic: item.topic,
        standardSearchQuery: item.query,
      }));
  };'''
          new = '''  const queryWithFilter = async (filter?: Record<string, string>) => {
    try {
      const result = await vectorize.query(queryVector, {
        topK: 80,
        returnMetadata: "all",
        ...(filter ? { filter } : {}),
      });

      return (result.matches || [])
        .filter(
          (match: any) =>
            match?.metadata?.contentType !== "document-map" &&
            typeof match?.metadata?.text === "string" &&
            match.metadata.text.trim().length > 0 &&
            matchBelongsToStandard(match, standard.compact) &&
            Number(match?.score || 0) >= minimumScore
        )
        .sort((a: any, b: any) => matchRank(b) - matchRank(a))
        .slice(0, 6)
        .map((match: any) => ({
          ...match,
          standardSearchTopic: item.topic,
          standardSearchQuery: item.query,
        }));
    } catch (error) {
      if (filter) {
        console.error("Standards metadata-filter query failed; falling back safely", {
          filter,
          standard: standard.code,
          message: error instanceof Error ? error.message : String(error),
        });
        return [];
      }
      throw error;
    }
  };'''
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected queryWithFilter block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify deterministic verifier remains intact
        run: |
          grep -q 'function verifyClaims' app/lib/standards-engine.ts
          grep -q 'excerptContainsClause' app/lib/standards-engine.ts
          grep -q 'evidenceContainsAllClaimNumbers' app/lib/standards-engine.ts
          grep -q 'metadata.contentType !== "document-map"' app/lib/standards-engine.ts
          grep -q 'falling back safely' app/lib/standards-engine.ts
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Fall back safely when Vectorize metadata filters are unavailable' && git push)

# safe patch trigger 2026-09-14
