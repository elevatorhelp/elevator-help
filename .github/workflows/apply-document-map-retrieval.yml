name: Apply Document Map Retrieval

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safe metadata-filter fallback
        run: node scripts/patch-standards-filter-fallback.mjs
      - name: Verify deterministic verifier remains intact
        run: |
          grep -q 'function verifyClaims' app/lib/standards-engine.ts
          grep -q 'excerptContainsClause' app/lib/standards-engine.ts
          grep -q 'evidenceContainsAllClaimNumbers' app/lib/standards-engine.ts
          grep -q 'metadata.contentType !== "document-map"' app/lib/standards-engine.ts
          grep -q 'falling back safely' app/lib/standards-engine.ts
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Fall back safely when Vectorize metadata filters are unavailable' && git push)
