name: Apply Document Map Retrieval

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Strengthen raw evidence retrieval guided by document map
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('app/lib/standards-engine.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const queryWithFilter = async (filter?: Record<string, string>) => {
    const result = await vectorize.query(queryVector, {
      topK: 40,
      returnMetadata: "all",
      ...(filter ? { filter } : {}),
    });

    return (result.matches || [])
      .filter(
        (match: any) =>
          match?.metadata?.contentType !== "document-map" &&
          typeof match?.metadata?.text === "string" &&
          match.metadata.text.trim().length > 0 &&
          matchBelongsToStandard(match, standard.compact) &&
          Number(match?.score || 0) >= MIN_STANDARD_SCORE
      )
      .sort((a: any, b: any) => matchRank(b) - matchRank(a))
      .slice(0, 4)
      .map((match: any) => ({
        ...match,
        standardSearchTopic: item.topic,
        standardSearchQuery: item.query,
      }));
  };

  const languageMatches = await queryWithFilter({ language: sourceLanguage });
  if (languageMatches.length) return languageMatches;

  // Legacy/raw standards vectors may not have reliable language metadata. Falling
  // back to an unfiltered search is safe because final claims still require an
  // exact standard match, an exact clause present in the raw excerpt and a
  // verbatim evidence quote from that same raw excerpt.
  return queryWithFilter();'''
          new = '''  const exactClauseQuery = /\\b\\d+(?:\\.\\d+){2,6}\\b/.test(item.query);
  const minimumScore = exactClauseQuery ? 0.12 : MIN_STANDARD_SCORE;

  const queryWithFilter = async (filter?: Record<string, string>) => {
    const result = await vectorize.query(queryVector, {
      topK: 80,
      returnMetadata: "all",
      ...(filter ? { filter } : {}),
    });

    return (result.matches || [])
      .filter(
        (match: any) =>
          match?.metadata?.contentType !== "document-map" &&
          typeof match?.metadata?.text === "string" &&
          match.metadata.text.trim().length > 0 &&
          matchBelongsToStandard(match, standard.compact) &&
          Number(match?.score || 0) >= minimumScore
      )
      .sort((a: any, b: any) => matchRank(b) - matchRank(a))
      .slice(0, 6)
      .map((match: any) => ({
        ...match,
        standardSearchTopic: item.topic,
        standardSearchQuery: item.query,
      }));
  };

  // Prefer vectors explicitly classified as standards so unrelated manuals do not
  // consume the nearest-neighbour window. Map nodes still never become evidence.
  const standardMatches = await queryWithFilter({ contentType: "standard" });
  if (standardMatches.length) return standardMatches;

  const languageMatches = await queryWithFilter({ language: sourceLanguage });
  if (languageMatches.length) return languageMatches;

  // Legacy/raw standards vectors may not have reliable enrichment metadata.
  // Falling back to an unfiltered search is safe because final claims still
  // require exact standard membership, an exact clause in the raw excerpt and a
  // verbatim evidence quote from that same raw excerpt.
  return queryWithFilter();'''
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected rawMatchesForQuery block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify deterministic verifier remains intact
        run: |
          grep -q 'function verifyClaims' app/lib/standards-engine.ts
          grep -q 'excerptContainsClause' app/lib/standards-engine.ts
          grep -q 'evidenceContainsAllClaimNumbers' app/lib/standards-engine.ts
          grep -q 'metadata.contentType !== "document-map"' app/lib/standards-engine.ts
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Use document map to improve standards evidence recall' && git push)
