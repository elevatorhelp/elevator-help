name: Deploy document-intelligence preview

on:
  push:
    branches: [document-intelligence]
  workflow_dispatch:

concurrency:
  group: document-intelligence-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Restore preview Gemini secret when needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          health_json=$(curl --silent --show-error \
            https://document-intelligence-elevator-help.baharmand.workers.dev/api/health/gemini \
            || true)
          if jq -e '.ok == true' <<<"$health_json" >/dev/null 2>&1; then
            echo "Preview runtime variables are healthy."
            exit 0
          fi

          npx wrangler versions list \
            --name elevator-help \
            --json > /tmp/production-worker-versions.json
          production_version=$(jq -r '
            sort_by(.metadata.created_on)
            | last.id // empty
          ' /tmp/production-worker-versions.json)
          test -n "$production_version"
          npx wrangler versions view "$production_version" \
            --name elevator-help \
            --json > /tmp/production-worker-version.json
          gemini_key=$(jq -r '
            .resources.bindings[]
            | select(.name == "GEMINI_API_KEY" and .type == "plain_text")
            | (.text // .value // empty)
          ' /tmp/production-worker-version.json)
          test -n "$gemini_key"
          printf '%s' "$gemini_key" \
            | npx wrangler secret put GEMINI_API_KEY \
                --name document-intelligence-elevator-help
          unset gemini_key
          unset production_version

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name document-intelligence-elevator-help \
            --keep-vars
