name: Deploy document-intelligence preview

on:
  push:
    branches: [document-intelligence]
  workflow_dispatch:

concurrency:
  group: document-intelligence-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Upload production-configured version preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload \
            --name elevator-help \
            --preview-alias doc-intel-gemini \
            --keep-vars
