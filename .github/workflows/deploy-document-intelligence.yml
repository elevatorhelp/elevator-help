name: Deploy document-intelligence preview

on:
  push:
    branches: [document-intelligence]
  workflow_dispatch:

concurrency:
  group: document-intelligence-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Restore preview runtime variables when needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          health_json=$(curl --silent --show-error \
            https://document-intelligence-elevator-help.baharmand.workers.dev/api/health/gemini \
            || true)
          if jq -e '.ok == true' <<<"$health_json" >/dev/null 2>&1; then
            echo "Preview runtime variables are healthy."
            exit 0
          fi

          npx wrangler versions list \
            --name document-intelligence-elevator-help \
            --json > /tmp/versions.json
          jq -r '.[] | [.id, (.metadata.created_on // "missing-date")] | @tsv' \
            /tmp/versions.json
          healthy_version=$(jq -r '
            [.. | objects
              | select(.id? and .metadata.created_on?)
              | {id, created: .metadata.created_on}]
            | unique_by(.id)
            | map(select(.created < "2026-09-28T21:17:00Z"))
            | sort_by(.created)
            | reverse
            | .[0].id // empty
          ' /tmp/versions.json)
          test -n "$healthy_version"
          npx wrangler rollback "$healthy_version" \
            --name document-intelligence-elevator-help \
            --yes \
            --message "Restore preview runtime variables before automated deploy"

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name document-intelligence-elevator-help \
            --keep-vars
