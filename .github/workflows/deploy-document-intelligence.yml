name: Deploy document-intelligence preview

on:
  push:
    branches: [document-intelligence]
  workflow_dispatch:

concurrency:
  group: document-intelligence-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Restore preview Gemini secret when needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          health_json=$(curl --silent --show-error \
            https://document-intelligence-elevator-help.baharmand.workers.dev/api/health/gemini \
            || true)
          if jq -e '.ok == true' <<<"$health_json" >/dev/null 2>&1; then
            echo "Preview runtime variables are healthy."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/elevator-help/settings" \
            > /tmp/production-worker-settings.json
          jq -e '.success == true' /tmp/production-worker-settings.json >/dev/null
          gemini_key=$(jq -r '
            .result.bindings[]
            | select(.name == "GEMINI_API_KEY" and .type == "plain_text")
            | .text
          ' /tmp/production-worker-settings.json)
          test -n "$gemini_key"
          printf '%s' "$gemini_key" \
            | npx wrangler secret put GEMINI_API_KEY \
                --name document-intelligence-elevator-help
          unset gemini_key

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name document-intelligence-elevator-help \
            --keep-vars
