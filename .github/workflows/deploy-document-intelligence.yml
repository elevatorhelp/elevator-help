name: Deploy document-intelligence preview

on:
  push:
    branches: [document-intelligence]
  workflow_dispatch:

concurrency:
  group: document-intelligence-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --name document-intelligence-elevator-help

      - name: Configure preview runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GEMINI_API_KEY"
          test -n "$ELEVATOR_INGESTION_TOKEN"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --name document-intelligence-elevator-help
          printf '%s' "$ELEVATOR_INGESTION_TOKEN" | npx wrangler secret put INGESTION_TOKEN --name document-intelligence-elevator-help
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON --name document-intelligence-elevator-help
