name: Deploy production

on:
  workflow_run:
    workflows: ["Build Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elevator-help-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Ensure multilingual Vectorize index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if ! npx wrangler vectorize get elevator-help-multilingual-v2 >/dev/null 2>&1; then
            npx wrangler vectorize create elevator-help-multilingual-v2 --dimensions=768 --metric=cosine
          fi

      - name: Deploy verified revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --name elevator-help --keep-vars

      - name: Verify production health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --max-time 45 \
              --output /tmp/health.json --write-out '%{http_code}' \
              https://elevator.help/api/health/gemini) || status=000
            if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1
