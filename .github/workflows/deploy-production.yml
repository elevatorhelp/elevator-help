name: Deploy production

# Production deployment is deliberate: verified main only. This workflow's
# own reviewed change can trigger a guarded deployment; manual dispatch remains.
# 2026-10-19: release the audited D1 write guard and private-log redaction from main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

concurrency:
  group: elevator-help-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare Worker
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" != pk_test_* && "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" != pk_live_* ]]; then
            echo 'Clerk publishable key missing or invalid; refusing unauthenticated UI build.' >&2
            exit 1
          fi
          npm run cf:build

      - name: Ensure multilingual Vectorize index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if ! npx wrangler vectorize get elevator-help-multilingual-v2 >/dev/null 2>&1; then
            npx wrangler vectorize create elevator-help-multilingual-v2 --dimensions=768 --metric=cosine
          fi

      - name: Apply D1 migrations before deploying compatible code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 migrations apply elevator-help-cortex --remote

      - name: Deploy verified revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --name elevator-help --keep-vars

      - name: Verify production health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --max-time 45 \
              --output /tmp/health.json --write-out '%{http_code}' \
              https://elevator.help/api/health/gemini) || status=000
            if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1
