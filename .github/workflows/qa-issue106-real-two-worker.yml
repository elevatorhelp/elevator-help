name: Issue106 manual REAL two-worker PDF QA
run-name: Issue106 2 distinct Drive PDFs / 2 Cloudflare QA Workers / independent D1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type QA_ONLY_TWO_PDFS_MAX_24_GEMINI_CALLS to approve ONE bounded QA execution"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false

jobs:
  real-qa-two-workers:
    if: github.repository == 'elevatorhelp/elevator-help' && github.ref == 'refs/heads/main' && inputs.confirmation == 'QA_ONLY_TWO_PDFS_MAX_24_GEMINI_CALLS'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout reviewed exact QA runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Check contracts and syntax without paid calls
        run: |
          set -euo pipefail
          bash -n scripts/qa-issue106-parallel-run.sh
          bash -n scripts/qa-issue106-worker-process-group.sh
          bash -n scripts/test-issue106-worker-process-group.sh
          bash scripts/test-issue106-worker-process-group.sh
          for script in scripts/qa-issue106-drive-readonly.mjs scripts/qa-issue106-worker-checkpoint.mjs scripts/qa-issue106-parallel-guard.mjs scripts/drive-ingest.mjs; do
            node --check "$script"
          done
          node scripts/test-issue106-real-parallel-guard.mjs
          node --check scripts/qa-issue106-resume-readonly.mjs
          node scripts/test-issue106-resume-readonly.mjs
          node --check scripts/qa-issue106-safe-worker-error.mjs
          node scripts/test-issue106-safe-worker-error.mjs
          node --experimental-strip-types scripts/test-issue106-raw-error-enums.mjs
          node --experimental-sqlite --experimental-strip-types scripts/test-issue106-raw-recovery.ts
          node --check scripts/qa-issue106-map-retry-gate.mjs
          node scripts/test-issue106-map-retry-gate.mjs
      - name: Verify BOTH original synthetic PDFs on real Google Drive before any Gemini call
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QA106_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/qa-issue106-drive-readonly.mjs
      - name: Gate paid retry on both persisted QA D1 Evidence checkpoints (READ ONLY)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGESTION_V2_QA_MODE: "true"
          QA106_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/qa-issue106-resume-readonly.mjs
      - name: Compile actual Cloudflare Worker without deploying Production
        run: npm run cf:build
      - name: Add only isolated Cloudflare QA D1 schemas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for sql in \
            docs/ingestion-global-coordinator-schema.sql \
            docs/ingestion-immutable-publication-schema.sql \
            docs/ingestion-v2-document-epoch-schema.sql \
            docs/ingestion-v2-evidence-reference-schema.sql \
            docs/ingestion-v2-pending-map-windows-schema.sql; do
            npx wrangler d1 execute elevator-help-lease-test-01 --remote \
              --config wrangler.qa-pr100-v2.json --file "$sql" > /dev/null
          done
          echo "PASS: isolated QA D1 only -- no Production schemas modified"
      - name: Two simultaneous remote Workers process two distinct PDF files
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_BENCHMARK_API_KEY }}
          QA106_CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/qa-issue106-parallel-run.sh
      - name: Retain sanitized pass-only proof (never source PDFs, Worker logs or secrets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue106-two-real-pdf-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/qa106-success-summary.txt
          if-no-files-found: warn
          retention-days: 30
