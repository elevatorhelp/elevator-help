name: Issue106 two real parallel QA Workers crash and stale lease proof (NO MODELS)
run-name: Issue106 A+B independent live Cloudflare QA Workers / 0 Gemini calls
on:
  push:
    branches: [feat/issue106-shadow-map-revision-20261122]
    paths: [".github/workflows/qa-issue106-real-parallel-no-model-once.yml"]
permissions:
  contents: read
concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false
jobs:
  two-qa-workers:
    if: >-
      github.repository == 'elevatorhelp/elevator-help' &&
      github.ref == 'refs/heads/feat/issue106-shadow-map-revision-20261122' &&
      github.event.head_commit.message == 'qa106(two-workers): run authorized real parallel lease crash test no models'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QA106_PARALLEL_CONFIRMATION: QA106_TWO_QA_COORDINATORS_NO_MODEL
    steps:
      - name: Checkout isolated QA code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Check no-model parallel scripts
        run: |
          set -euo pipefail
          node --check scripts/qa-issue106-real-parallel-lease-proof.mjs
          bash -n scripts/qa-issue106-real-parallel-no-model-run.sh
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GEMINI_BENCHMARK_API_KEY:-}"
      - name: Compile actual isolated QA Worker (NO deployment)
        run: npm run cf:build
      - name: Run two simultaneous Cloudflare Workers and D1 stale owner fencing
        run: bash scripts/qa-issue106-real-parallel-no-model-run.sh
      # No PDF extraction, vector writes, Gemini or Workers AI credentials.
