name: Issue99 QA Google Drive real PDF read-only preflight
run-name: Issue99 real Drive restricted service-account folder and PDF integrity probe
on:
  push:
    branches:
      - qa/issue99-real-drive-readonly-20261115
    paths:
      - .github/workflows/qa-issue99-drive-readonly.yml
      - scripts/qa-issue99-drive-readonly.mjs
permissions:
  contents: read
concurrency:
  group: issue99-google-drive-readonly-preflight
  cancel-in-progress: false
jobs:
  read-only:
    if: github.repository == 'elevatorhelp/elevator-help'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Real Drive QA-only folder read and exact PDF two-page extraction
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node --check scripts/qa-issue99-drive-readonly.mjs
          node scripts/qa-issue99-drive-readonly.mjs
      # This workflow does not contact Cloudflare or Gemini, and never writes to Drive.
