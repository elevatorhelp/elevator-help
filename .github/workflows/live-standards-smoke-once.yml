name: One-shot standards vector diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-standards-smoke-once.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live standards retrieval
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 90 -X POST https://elevator.help/api/retrieve-test \
            -H 'Content-Type: application/json' \
            --data '{"question":"EN 81-20 5.2.5.3.1 horizontaler Abstand innere Schachtwand Fahrkorbschwelle"}'
          curl --silent --show-error --max-time 90 -X POST https://elevator.help/api/retrieve-test \
            -H 'Content-Type: application/json' \
            --data '{"question":"EN 81-20 5.3.4.1 horizontaler Abstand Schwellen Fahrkorbzugang Schachttür 35 mm"}'
