name: Apply Standards Coverage Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-standards-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Improve raw standards recall
        run: sed -i 's/const MIN_STANDARD_SCORE = 0.32;/const MIN_STANDARD_SCORE = 0.20;/' app/lib/standards-engine.ts
      - name: Verify deterministic verifier remains present
        run: grep -q 'function verifyClaims' app/lib/standards-engine.ts && grep -q 'excerptContainsClause' app/lib/standards-engine.ts && grep -q 'evidenceContainsAllClaimNumbers' app/lib/standards-engine.ts
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Raise standards raw evidence recall safely' && git push)
