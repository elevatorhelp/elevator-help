name: Apply Standards Coverage Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-standards-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Add direct structure retrieval query
        run: |
          python -c "from pathlib import Path; p=Path('app/lib/standards-engine.ts'); s=p.read_text(encoding='utf-8'); old='          query: \"Schachtwand mechanische Festigkeit Verformung Kraft Glas Verbundsicherheitsglas\",'; new=old+'\n        },\n        {\n          topic: \"structure\",\n          query: \"EN 81-20 5.2.1.8.2 Schachtwände mechanische Festigkeit Verformung\",'; assert old in s or 'EN 81-20 5.2.1.8.2 Schachtwände' in s; s=s if 'EN 81-20 5.2.1.8.2 Schachtwände' in s else s.replace(old,new,1); p.write_text(s,encoding='utf-8')"
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/lib/standards-engine.ts
          git diff --cached --quiet || (git commit -m 'Prioritize verified shaft-wall clause retrieval' && git push)
