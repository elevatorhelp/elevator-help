name: Apply Standards Coverage Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-standards-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Patch broad-shaft standards coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/lib/standards-engine.ts')
          s = p.read_text(encoding='utf-8')

          old_query = '''        {
          topic: "structure",
          query: "Schachtwand mechanische Festigkeit Verformung Kraft Glas Verbundsicherheitsglas",
        },'''
          new_query = '''        {
          topic: "structure",
          query: "Schachtwand mechanische Festigkeit Verformung Kraft Glas Verbundsicherheitsglas",
        },
        {
          topic: "structure",
          query: "EN 81-20 5.2.1.8.2 Schachtwände mechanische Festigkeit Verformung",
        },'''
          assert old_query in s or 'EN 81-20 5.2.1.8.2 Schachtwände' in s
          if 'EN 81-20 5.2.1.8.2 Schachtwände' not in s:
              s = s.replace(old_query, new_query, 1)

          old_en_query = '''        {
          topic: "structure",
          query: "shaft wall mechanical strength deformation force laminated safety glass",
        },'''
          new_en_query = '''        {
          topic: "structure",
          query: "shaft wall mechanical strength deformation force laminated safety glass",
        },
        {
          topic: "structure",
          query: "EN 81-20 5.2.1.8.2 shaft walls mechanical strength deformation",
        },'''
          assert old_en_query in s or 'EN 81-20 5.2.1.8.2 shaft walls' in s
          if 'EN 81-20 5.2.1.8.2 shaft walls' not in s:
              s = s.replace(old_en_query, new_en_query, 1)

          verify_anchor = '    if (!selected || selected.standardCode !== standard) continue;'
          assert verify_anchor in s
          if 'normalizeTopic(selected.standardSearchTopic) !== topic' not in s:
              s = s.replace(
                  verify_anchor,
                  verify_anchor + '\n    if (normalizeTopic(selected.standardSearchTopic) !== topic) continue;',
                  1,
              )

          old_gate = '''  const selected = selectClaimsForAnswer(verified, retrieval.broad);

  if (!selected.length) {'''
          new_gate = '''  const selected = selectClaimsForAnswer(verified, retrieval.broad);

  if (retrieval.broad) {
    const coveredTopics = new Set(
      selected.map((claim) => claim.topic).filter((topic) => topic !== "general")
    );
    const hasStructure = selected.some((claim) => claim.topic === "structure");

    if (!hasStructure || coveredTopics.size < 3) {
      return {
        sufficient: false,
        answer: unverifiedMessage(route.questionLanguage),
        checkedStandards,
      };
    }
  }

  if (!selected.length) {'''
          assert old_gate in s or 'coveredTopics.size < 3' in s
          if 'coveredTopics.size < 3' not in s:
              s = s.replace(old_gate, new_gate, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build
        run: npm ci && npm run build

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'elevatorhelp-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/lib/standards-engine.ts
          git commit -m 'Require diversified coverage for broad standards answers'
          git push
