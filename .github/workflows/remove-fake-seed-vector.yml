name: Remove fake seed vector

on:
  push:
    branches: [document-intelligence]
    paths:
      - '.github/workflows/remove-fake-seed-vector.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact fake vector
        env:
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ELEVATOR_INGESTION_TOKEN"
          response=$(curl --fail-with-body --silent --show-error \
            -X POST https://elevator.help/api/drive-ingest-batch \
            -H "Authorization: Bearer $ELEVATOR_INGESTION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"action":"delete","ids":["drv-7cd3ce11082620861dd2d31223cee39e76e13771"]}')
          printf '%s' "$response" | grep -q '"deleted":1'
