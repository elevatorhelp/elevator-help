name: Isolated Lease Contract Check
on:
  push:
    branches: [feat/pr61-lease-primitives-20261024]
    paths:
      - 'app/lib/ingestion-lease-*.ts'
      - 'scripts/test-ingestion-lease-operations.ts'
      - '.github/workflows/lease-contract-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lease:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Test actual D1 lease claim renewal expiry and stale fencing
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-lease-operations.ts
