name: QA105 actual isolated HTTP deny-by-default Clerk gate (NO MODELS)
on:
  push:
    branches: [feat/issue106-shadow-map-revision-20261122]
    paths: [".github/workflows/qa105-exact-citation-auth-deny-once.yml"]
permissions:
  contents: read
concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false
jobs:
  qa105-live-deny:
    if: >-
      github.repository == 'elevatorhelp/elevator-help' &&
      github.ref == 'refs/heads/feat/issue106-shadow-map-revision-20261122' &&
      github.event.head_commit.message == 'qa105(auth): run no-model default-off QA HTTP check'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QA105_NO_MODEL_CONFIRMATION: QA105_DISABLED_AUTH_GATE_HTTP_ONLY
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Verify no provider/Clerk secrets
        run: |
          set -euo pipefail
          bash -n scripts/qa105-exact-citation-auth-deny-run.sh
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GEMINI_BENCHMARK_API_KEY:-}"
          test -z "${CLERK_SECRET_KEY:-}"
      - name: Build QA Worker without deploying
        run: npm run cf:build
      - name: Actual HTTP probe must fail closed for unsigned and forged tokens
        run: bash scripts/qa105-exact-citation-auth-deny-run.sh

# Reviewed auth-on dummy-key 401 branch; never accepts valid Clerk token.

