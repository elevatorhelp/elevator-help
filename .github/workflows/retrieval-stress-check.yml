name: Synthetic Retrieval Stress Check
on:
  pull_request:
    paths:
      - 'scripts/benchmark-retrieval-stress.mjs'
      - '.github/workflows/retrieval-stress-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Run offline synthetic stress suite
        run: |
          node --check scripts/benchmark-retrieval-stress.mjs
          node scripts/benchmark-retrieval-stress.mjs
