name: PR61 Cloudflare-only Gemini QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-pr61-cloudflare-secret.yml
permissions:
  contents: read
concurrency:
  group: qa-pr61-cloudflare-gemini
  cancel-in-progress: false
jobs:
  isolated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned PR61 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e116239dbabb1eea67764020e947d52e95189598
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Enforce Next.js security floor and QA-only OpenNext compatibility
        run: |
          set -euo pipefail
          node scripts/guard-next-security-baseline.mjs
          npm install --no-save --ignore-scripts @opennextjs/cloudflare@1.20.12
          test "$(node -p 'require("next/package.json").version')" = "16.4.2"
          test "$(node -p 'require("./node_modules/@opennextjs/cloudflare/package.json").version')" = "1.20.12"
      - name: Validate isolated lease and three-layer publication contracts
        run: |
          node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-lease-operations.ts
          node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-full-publication.ts
      - name: Verify published evidence isolation
        run: node --experimental-sqlite --experimental-strip-types scripts/test-published-evidence-generation.ts
      - name: Test QA Drive endpoint isolation
        run: node scripts/test-staged-qa-endpoint-guard.mjs
      - name: Build actual app
        run: npm run cf:build
      - name: Create QA-only D1 tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute elevator-help-lease-test-01 --remote --config wrangler.qa-app-deployed.json --file scripts/qa-pr61-bootstrap.sql
          npx wrangler d1 execute elevator-help-lease-test-01 --remote --config wrangler.qa-app-deployed.json --file docs/ingestion-full-publication-schema.sql
      - name: Deploy protected QA Worker and inject disposable auth token only
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          QA_INGESTION_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$QA_INGESTION_TOKEN"
          echo "QA_INGESTION_TOKEN=$QA_INGESTION_TOKEN" >> "$GITHUB_ENV"
          npx wrangler deploy --config wrangler.qa-app-deployed.json 2>&1 | tee /tmp/qa61-deploy.log
          printf '%s' "$QA_INGESTION_TOKEN" | npx wrangler secret put QA_INGESTION_TOKEN --config wrangler.qa-app-deployed.json >/dev/null
          printf '%s' "$QA_INGESTION_TOKEN" | npx wrangler secret put INGESTION_TOKEN --config wrangler.qa-app-deployed.json >/dev/null
          QA_APP_BASE_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/qa61-deploy.log | head -n1 | sed 's/[[:space:]]*$//' || true)
          if [ -z "$QA_APP_BASE_URL" ]; then
            echo "::error::Cloudflare worker URL could not be verified from deploy output"
            exit 1
          fi
          echo "QA_APP_BASE_URL=$QA_APP_BASE_URL" >> "$GITHUB_ENV"
      - name: Verify Cloudflare secret presence without reading values
        id: secret-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx wrangler secret list --config wrangler.qa-app-deployed.json | grep -Eq '"name"[[:space:]]*:[[:space:]]*"GEMINI_API_KEY"'; then
            echo "positive=true" >> "$GITHUB_OUTPUT"
            echo "Gemini secret present in isolated Cloudflare Worker"
          else
            echo "positive=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY absent from isolated Cloudflare QA Worker. Run negative safety tests only."
          fi
      - name: Test real deployed application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QA_NEGATIVE_ONLY: ${{ steps.secret-check.outputs.positive == 'true' && 'false' || 'true' }}
        run: node scripts/qa-pr61-full-app-e2e.mjs
      - name: Single-document Google Drive pilot (isolated resources only)
        if: steps.secret-check.outputs.positive == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TARGET_FILE_ID: 1VRn4-2Pm_Pl_W5gU0OYmRl_Oh2xljMYf
          DRIVE_FOLDER_ID: 1yv6DUDvXfTvCxEGJc3p2VozILtx40chE
          INGEST_ENDPOINT: https://elevator-help-pr61-app-qa.baharmand.workers.dev/api/drive-ingest-batch
          DOCUMENT_MAP_ENDPOINT: https://elevator-help-pr61-app-qa.baharmand.workers.dev/api/document-map-ingest
          STAGED_AUTO_LEASE: "true"
          ALLOW_EMPTY_INGESTION_STATE: "true"
          STATE_PATH: .ingestion-state/qa-drive-pilot.json
          MAX_FILES: "1"
          MAX_GEMINI_CALLS: "24"
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::Google Drive service-account secret missing"; exit 1; }
          test -n "$QA_INGESTION_TOKEN" || exit 1
          export ELEVATOR_INGESTION_TOKEN="$QA_INGESTION_TOKEN"
          node scripts/drive-ingest.mjs
          test -s "$STATE_PATH"
          node -e 'const s=require("./.ingestion-state/qa-drive-pilot.json"); const files=Object.values(s.scopes||{}).flatMap(x=>Object.values(x.files||{})); if(files.length!==1||!files[0].fingerprint||files[0].fingerprint!==files[0].rawFingerprint||files[0].fingerprint!==files[0].evidenceFingerprint||files[0].fingerprint!==files[0].mapFingerprint) process.exit(1); console.log("PASS: single-document isolated Drive pilot persisted complete three-layer checkpoint");'


      - name: Verify real Drive document exact retrieval and citation
        if: steps.secret-check.outputs.positive == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/qa-drive-evidence-readback.mjs
