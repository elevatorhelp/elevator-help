name: Apply Lazy Retrieval Bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-lazy-retrieval-bindings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Keep Gemini-first broad questions independent of retrieval bindings
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/api/ask/route.ts')
          s=p.read_text()
          old='''    const { env } = getCloudflareContext();\n    const ai = (env as any).AI;\n    const vectorize = (env as any).VECTORIZE;\n\n    if (isStandardsQuestion(question, route)) {\n'''
          new='''    const standardsQuestion = isStandardsQuestion(question, route);\n    const needsRetrievalBindings = standardsQuestion || hasEnoughRoutingContext(route);\n    let ai: any = null;\n    let vectorize: any = null;\n\n    if (needsRetrievalBindings) {\n      const { env } = getCloudflareContext();\n      ai = (env as any).AI;\n      vectorize = (env as any).VECTORIZE;\n    }\n\n    if (standardsQuestion) {\n'''
          if old not in s:
              raise SystemExit('Cloudflare context anchor not found')
          s=s.replace(old,new,1)
          old2='''    const retrieval = await retrieveOwnKnowledge(\n      question,\n      route,\n      apiKey,\n      ai,\n      vectorize\n    );\n'''
          new2='''    const retrieval = hasEnoughRoutingContext(route)\n      ? await retrieveOwnKnowledge(\n          question,\n          route,\n          apiKey,\n          ai,\n          vectorize\n        )\n      : null;\n'''
          if old2 not in s:
              raise SystemExit('retrieval anchor not found')
          p.write_text(s.replace(old2,new2,1))
      - name: Verify and build
        run: |
          grep -q 'needsRetrievalBindings' app/api/ask/route.ts
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name elevatorhelp-bot
          git config user.email actions@users.noreply.github.com
          git add app/api/ask/route.ts
          git diff --cached --quiet || (git commit -m 'Make retrieval bindings lazy for Gemini-first broad questions' && git push)
