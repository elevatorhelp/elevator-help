name: Cloudflare Diagnostics

on:
  push:
    paths:
      - .github/workflows/cloudflare-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Required Cloudflare secrets are configured."

      - name: Verify Cloudflare API authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          echo "$response" | jq -e '.success == true and .result.status == "active"' >/dev/null
          echo "Cloudflare account API token is active."

      - name: Verify elevator-help Worker is visible
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl --silent --show-error --output /tmp/worker.js --write-out "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/elevator-help")
          if [ "$status" != "200" ]; then
            echo "Unable to read elevator-help Worker; HTTP $status"
            exit 1
          fi
          echo "elevator-help Worker is visible through the restricted token."

      - name: Verify Vectorize index is visible
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/vectorize/v2/indexes/elevator-help-index")
          echo "$response" | jq -e '.success == true' >/dev/null
          echo "elevator-help-index is visible through the restricted token."

      - name: Live API sanity check
        run: |
          status=$(curl --silent --show-error --output /tmp/live.json --write-out "%{http_code}" \
            -X POST "https://elevator.help/api/ask" \
            -H "Content-Type: application/json" \
            --data '{"question":"Was sagt die Norm über den Aufzugsschacht?"}')
          echo "Live API HTTP status: $status"
          cat /tmp/live.json
          test "$status" = "200"
          jq -e '.answer and (.answer | length > 0)' /tmp/live.json >/dev/null
          echo "Live elevator.help API returned an answer."
