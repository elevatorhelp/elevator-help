name: Ingest verified FST-3 manual

on:
  push:
    branches: [document-intelligence]
    paths:
      - '.github/workflows/ingest-fst3-once.yml'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ingest one verified official manual
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ELEVATOR_INGESTION_TOKEN: ${{ secrets.ELEVATOR_INGESTION_TOKEN }}
          DRIVE_FOLDER_ID: "1Lu7If9Nt4GUyakB6b6YriOGkvBPkx5i5"
          TARGET_FILE_ID: "1xQ7LmL_J31mmkstVRk3yAVT6Ksu_22pL"
          MAX_FILES: "1"
          INGEST_ENDPOINT: "https://elevator.help/api/drive-ingest-batch"
          DOCUMENT_MAP_ENDPOINT: "https://elevator.help/api/document-map-ingest"
          STATE_PATH: ".ingestion-state/fst3-once.json"
        run: node scripts/drive-ingest.mjs
