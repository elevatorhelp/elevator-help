
name: Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Enforce security baseline for Next.js
        run: node scripts/guard-next-security-baseline.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test German compound language
        run: npm run test:language

      - name: Test security baseline
        run: npm run test:security

      - name: Test message editing
        run: npm run test:conversation-edit

      - name: Rehearse offline staged publication snapshot and restore
        run: node --experimental-sqlite scripts/test-ingestion-restore-roundtrip.mjs

      - name: Guard isolated QA endpoint security boundary
        run: node scripts/test-qa-ingestion-edge-guard.mjs

      - name: Guard manual-only paid QA dispatch
        run: node scripts/test-qa-pr61-multipage-dispatch-guard.mjs

      - name: Guard isolated actual-app QA checkout, billing opt-in and D1 bindings
        run: |
          node --experimental-sqlite scripts/test-qa-pr61-bootstrap.mjs
          node scripts/test-qa-pr61-actual-app-safety.mjs

      - name: Test multilingual physical PDF page labels and source-bound clause verification
        run: node --experimental-strip-types scripts/test-standards-source-page.ts

      - name: Test Clerk verifier contract without live credentials
        run: node --experimental-strip-types scripts/test-request-auth-contract.mjs

      - name: Test authenticated chat gate
        run: npm run test:request-auth

      - name: Check signed-in customer citation QA harness and physical PDF page labels
        run: |
          node --check scripts/qa-authenticated-ask-citation.mjs
          node scripts/test-qa-physical-pdf-page.mjs

      - name: Test Gemini cost controls
        run: npm run test:gemini-cost-control

      - name: Test privacy of stored learning candidates
        run: npm run test:cortex-learning

      - name: Test standards presentation
        run: npm run test:standards-presentation

      - name: Test multilingual retrieval contract
        run: npm run test:multilingual-retrieval

      - name: Characterize legacy standards fallback offline
        run: node scripts/test-standards-legacy-fallback.mjs

      - name: Test incremental archive ingestion
        run: npm run test:incremental-ingestion

      - name: Test document identity and language detection
        run: node scripts/test-document-identity.mjs

      - name: Test generic clause identifiers
        run: |
          node --experimental-strip-types scripts/test-generic-clause-parser.ts
          node --experimental-strip-types scripts/test-clause-casing.ts
          node --experimental-strip-types scripts/test-standards-clause-boundary.ts

      - name: Test standards topic retrieval despite broad exact hits
        run: node scripts/test-cortex-standards-topic-retrieval.mjs

      - name: Test compact and legacy exact-evidence index
        run: node --experimental-sqlite --experimental-strip-types scripts/test-compact-evidence.mjs

      - name: Test D1 lease SQL contract (offline SQLite)
        run: node --experimental-sqlite --disable-warning=ExperimentalWarning --test scripts/test-d1-lease-sql.mjs

      - name: Test adaptive ingestion planner (Issue #60)
        run: node --test scripts/adaptive-ingestion-controller.test.mjs

      - name: Test automatic D1 lease acquisition and renewal
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-lease-operations.ts

      - name: Test lease ownership loss during in-flight ingestion
        run: node --experimental-strip-types scripts/test-ingestion-lease-boundaries.ts

      - name: Test crash-safe generation publication protocol
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-generation-publication.ts

      - name: Test staged Vectorize visibility against D1 publication
        run: node --experimental-strip-types scripts/test-ingestion-publication-visibility.ts

      - name: Verify exact retrieval honors published document generations
        run: node --experimental-sqlite --experimental-strip-types scripts/test-published-evidence-generation.ts

      - name: Test three-layer atomic RAW Evidence Map publication
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-full-publication.ts

      - name: Test complete-document staged publication with crash recovery
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-complete-publication.ts

      - name: Test multi-batch lease renewal and restart fencing
        run: node --experimental-sqlite --experimental-strip-types scripts/test-ingestion-multibatch-recovery.ts

      - name: Build
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run cf:build
