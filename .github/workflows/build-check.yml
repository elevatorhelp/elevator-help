
name: Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Enforce security baseline for Next.js
        run: node scripts/guard-next-security-baseline.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test German compound language
        run: npm run test:language

      - name: Test security baseline
        run: npm run test:security

      - name: Test message editing
        run: npm run test:conversation-edit

      - name: Test authenticated chat gate
        run: npm run test:request-auth

      - name: Test admin-only monitoring access
        run: node --experimental-strip-types scripts/test-admin-authorization.ts

      - name: Test Cloudflare admin metrics in isolated mock
        run: node --experimental-strip-types scripts/test-admin-cloudflare-analytics.ts

      - name: Test read-only archive evidence inventory
        run: node --experimental-strip-types scripts/test-admin-archive-inventory.ts

      - name: Test admin active question-users metrics
        run: node --experimental-strip-types scripts/test-admin-active-users.ts

      - name: Test archive Drive scan metrics from Actions logs
        run: node --experimental-strip-types scripts/test-admin-archive-run-metrics.ts

      - name: Test Gemini cost controls
        run: npm run test:gemini-cost-control

      - name: Test privacy of stored learning candidates
        run: npm run test:cortex-learning

      - name: Test standards presentation
        run: npm run test:standards-presentation

      - name: Test multilingual retrieval contract
        run: npm run test:multilingual-retrieval

      - name: Characterize legacy standards fallback offline
        run: node scripts/test-standards-legacy-fallback.mjs

      - name: Test incremental archive ingestion
        run: npm run test:incremental-ingestion

      - name: Test document identity and language detection
        run: node scripts/test-document-identity.mjs

      - name: Test generic clause identifiers
        run: |
          node --experimental-strip-types scripts/test-generic-clause-parser.ts
          node --experimental-strip-types scripts/test-clause-casing.ts
          node --experimental-strip-types scripts/test-standards-clause-boundary.ts

      - name: Test compact and legacy exact-evidence index
        run: node --experimental-sqlite --experimental-strip-types scripts/test-compact-evidence.mjs

      - name: Test Issue106 isolated Wrangler shutdown (offline, no paid calls)
        run: |
          bash -n scripts/qa-issue106-parallel-run.sh
          bash -n scripts/qa-issue106-worker-process-group.sh
          bash -n scripts/test-issue106-worker-process-group.sh
          bash scripts/test-issue106-worker-process-group.sh

      - name: Test Issue106 read-only resumed Evidence/checkpoint guards
        run: |
          node --check scripts/qa-issue106-resume-readonly.mjs
          node scripts/test-issue106-resume-readonly.mjs

      - name: Validate Issue106 redacted Worker diagnostics and no-cost D1 state summaries
        run: |
          node --check scripts/qa-issue106-safe-worker-error.mjs
          node --check scripts/qa-issue106-d1-readonly-diagnostic.mjs
          node scripts/test-issue106-safe-worker-error.mjs
          node scripts/test-issue106-d1-readonly-diagnostic.mjs
          node --check scripts/qa-issue106-receipts-readonly.mjs
          node scripts/test-issue106-receipts-readonly.mjs
          node --experimental-strip-types scripts/test-issue106-raw-error-enums.mjs
          node --experimental-sqlite --experimental-strip-types scripts/test-issue106-raw-recovery.ts
          node --check scripts/qa-issue106-map-retry-gate.mjs
          node scripts/test-issue106-map-retry-gate.mjs
          node --check scripts/qa-issue106-map-only-preflight.mjs
          node scripts/test-issue106-map-only-preflight.mjs
          node scripts/test-issue106-map-only-runner.mjs
          node --check scripts/qa-issue106-vector-status-worker.mjs
          node scripts/test-issue106-vector-status.mjs
          node --check scripts/qa-issue106-b-repair-readonly.mjs
          node scripts/test-issue106-b-repair-readonly.mjs
          node scripts/test-issue106-b-repair-runner.mjs
          node --experimental-strip-types scripts/test-issue106-b-exact-map-repair.ts
          node --experimental-sqlite --experimental-strip-types scripts/test-issue106-map-revision-shadow.ts
          node --experimental-sqlite --experimental-strip-types scripts/test-issue106-map-migration-restore.ts
          node --experimental-strip-types scripts/test-issue106-legacy-evidence-gate.ts
          bash -n scripts/qa-issue106-b-map-repair-run.sh
          bash -n scripts/qa-issue106-b-shadow-run.sh
          node --check scripts/qa-issue106-b-shadow-client.mjs
          node scripts/test-issue106-b-shadow-client.mjs
          bash -n scripts/qa-issue106-vector-status-run.sh
          bash -n scripts/qa-issue106-map-only-run.sh

      - name: Test manual TEST Clerk positive QA runner fail-closed (offline)
        run: |
          bash -n scripts/qa105-clerk-positive-run.sh
          node --check scripts/qa105-clerk-positive-probe.mjs
          node scripts/test-qa105-clerk-positive-gate.mjs

      - name: Verify isolated QA no-model ask never proxies Production (static guard)
        run: node scripts/test-qa106-no-production-proxy.mjs

      - name: Build
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run cf:build
