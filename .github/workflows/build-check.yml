name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test German compound language
        run: npm run test:language

      - name: Test standards presentation
        run: npm run test:standards-presentation

      - name: Test multilingual retrieval contract
        run: npm run test:multilingual-retrieval

      - name: Test incremental archive ingestion
        run: npm run test:incremental-ingestion

      - name: Build
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run cf:build
