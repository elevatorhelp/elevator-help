name: Issue106 manual MAP-only receipt recovery (NO Gemini)
run-name: Issue106 two-PDF Map-only D1/Vectorize reconciliation - NO Gemini key

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type QA106_MAP_RECOVERY_NO_GEMINI (no model key or new embedding)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false

jobs:
  recover-only:
    if: github.repository == 'elevatorhelp/elevator-help' && github.ref == 'refs/heads/main' && inputs.confirmation == 'QA106_MAP_RECOVERY_NO_GEMINI'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed QA-only code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Test map-only guard and process lifecycle without any external model calls
        run: |
          set -euo pipefail
          bash -n scripts/qa-issue106-map-only-run.sh
          bash -n scripts/qa-issue106-worker-process-group.sh
          bash scripts/test-issue106-worker-process-group.sh
          node --check scripts/qa-issue106-map-only-preflight.mjs
          node scripts/test-issue106-map-only-preflight.mjs
          node scripts/test-issue106-map-only-runner.mjs
          node scripts/test-issue106-map-retry-gate.mjs
      - name: Verify exact two PDF fingerprints and previous checkpoints (Google and D1 READ ONLY)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGESTION_V2_QA_MODE: "true"
          QA106_CONFIRMATION: "QA_ONLY_TWO_PDFS_MAX_24_GEMINI_CALLS"
        run: |
          node scripts/qa-issue106-drive-readonly.mjs
          node scripts/qa-issue106-resume-readonly.mjs
      - name: Require both RAW-complete D1 checkpoints and exact pending Map intents (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QA106_MAP_ONLY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/qa-issue106-map-only-preflight.mjs
      - name: Build remote QA Worker without deploying Production
        run: npm run cf:build
      - name: Recover Map receipts and attest BOTH publications without Gemini credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QA106_MAP_ONLY_CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/qa-issue106-map-only-run.sh
      - name: Retain sanitized PASS proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue106-map-only-${{ github.run_id }}
          path: ${{ runner.temp }}/qa106-map-only-proof.txt
          if-no-files-found: warn
          retention-days: 30
