name: Issue106 real QA B generic Reader and exact citation proof
on:
  push:
    branches: [feat/issue106-shadow-map-revision-20261122]
    paths:
      - ".github/workflows/qa-issue106-b-reader-verify-once.yml"
permissions:
  contents: read
concurrency:
  group: issue106-one-time-two-worker-qa
  cancel-in-progress: false
jobs:
  qa-b-reader:
    if: >-
      github.repository == 'elevatorhelp/elevator-help' &&
      github.ref == 'refs/heads/feat/issue106-shadow-map-revision-20261122' &&
      github.event.head_commit.message == 'qa106(reader): verify B generic publication and exact source pages'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QA106_B_SHADOW_CONFIRMATION: QA106_B_GENERIC_READER_NO_MODEL
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify zero-model source checks and syntax
        run: |
          set -euo pipefail
          bash -n scripts/qa-issue106-b-reader-run.sh
          node --check scripts/qa-issue106-b-reader-client.mjs
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GEMINI_BENCHMARK_API_KEY:-}"
      - name: Build isolated QA Worker
        run: npm run cf:build
      - name: Activate QA-only B generic Reader and verify real citations
        run: bash scripts/qa-issue106-b-reader-run.sh
